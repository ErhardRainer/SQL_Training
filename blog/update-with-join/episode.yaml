systems:
  SQLServer:
    role: "lead"
    reason: "Der Begriff 'Update with Join' verweist im Repo und in der Alltagssprache am direktesten auf T-SQL `UPDATE ... FROM`; zugleich formuliert die SQL-Server-Dokumentation die Determinismuswarnung besonders scharf."
  PostgreSQL:
    role: "contrast_strong"
    reason: "PostgreSQL benutzt eine aehnliche `UPDATE ... FROM`-Oberflaeche, warnt aber explizit davor, dass bei Mehrfachtreffern nur eine nicht gut vorhersagbare Join-Zeile wirksam wird."
  Oracle:
    role: "contrast_strong"
    reason: "Oracle ist fachlich wichtig, weil aktuelle Releases direkte Joins in `UPDATE` kennen, fruehere verbreitete Releases aber ueber Subquery-/MERGE-Muster arbeiteten; das macht die Problemklasse statt der Syntax sichtbar."
  MySQL:
    role: "contrast_strong"
    reason: "MySQL modelliert das Thema ueber die Multi-Table-Update-Form und besitzt eigene Restriktionen und Betriebsrisiken, insbesondere bei FK-bezogenen Updates."
  ANSI95:
    role: "meta"
    reason: "Trennt Problemklasse, Standardebene und Produktauspraegung; starke Produktbehauptungen werden jedoch nicht allein auf ANSI gestuetzt."

