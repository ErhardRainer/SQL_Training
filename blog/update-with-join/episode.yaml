risk_classes:
  robust:
    description: "Die Quelle liefert pro Zielzeile nachweisbar genau null oder eine relevante Quellzeile; die Eindeutigkeit ist fachlich und idealerweise durch Constraint oder vorbereitete Verdichtung abgesichert."
    examples:
      - "Lookup-Update mit garantiert eindeutiger Business-Key-Quelle"
      - "Voraggregierte oder deduplizierte Staging-Menge mit dokumentiertem Regelwerk"
    refinements:
      - "constraint_proven"
      - "staging_hardened"
  conditionally_safe:
    description: "Die Operation ist beherrschbar, aber nur unter dokumentierten Vorbedingungen wie Deduplikation, begrenztem Batchfenster oder klaren Konfliktregeln."
    examples:
      - "Deduplikation per vorbereiteter Zwischenmenge vor dem eigentlichen Update"
      - "Batchweise Abarbeitung mit sauberer Wiederanlaufstrategie"
    refinements:
      - "dedupe_required"
      - "batch_operated"
  risky:
    description: "Die Trefferbildung ist formal moeglich, aber Mehrfachtreffer, breite Locking-Auswirkungen oder undeutliche Wertquellen machen das Ergebnis oder den Betrieb unsicher."
    examples:
      - "Join-Update ohne nachweisbare 1:1-Kardinalitaet"
      - "Grosses Produktiv-Update ohne Vorpruefung von Log, Replikation oder Sperrverhalten"
    refinements:
      - "multi_match_possible"
      - "operationally_hot"
  avoid:
    description: "Die Operation sollte in dieser Form nicht produktiv verwendet werden, weil Semantik, Korrektheit oder Betriebsrisiko nicht mehr verantwortbar sind."
    examples:
      - "Blindes Join-Update mit bewusst tolerierten Mehrfachtreffern"
      - "Mehrtabellen-Schreiboperation, wenn eine einspaltige Zielkorrektur mit vorbereiteter Quelle robuster waere"
    refinements:
      - "implicit_winner"
      - "mixed_write_surface"

preflight_checks:
  - "Ist pro Zielzeile nachweisbar, wie viele Quellzeilen relevant sein duerfen?"
  - "Ist die Quellmenge bereits dedupliziert oder aggregiert, falls fachlich mehrere Rohzeilen existieren?"
  - "Welche Spalten stammen aus der Quelle und welche nur aus Ziel- oder Konstantlogik?"
  - "Welche Unique Keys, Foreign Keys oder Indizes stützen die angenommene Kardinalitaet?"
  - "Wie gross sind Logging-, Bloat-, Undo-, Replica- oder Temp-Effekte im Zielsystem?"
  - "Welche Sessions oder Prozesse koennen waehrend des Updates konkurrieren?"
  - "Gibt es Trigger, Historisierung, CDC, Replikation oder Auditmechanismen, die Nebenwirkungen erzeugen?"
  - "Ist ein Ruecksetz- oder Wiederanlaufpfad definiert, falls die betroffene Zeilenmenge oder Dauer abweicht?"

decision_model:
  - step: 1
    question: "Liefert die fachliche Regel pro Zielzeile maximal eine wirksame Quellzeile?"
    action_if_yes: "Direktes Join-Update bleibt im Kandidatenkreis."
    action_if_no: "Vor dem Update zwingend verdichten, deduplizieren oder auf Staging/Alternativmuster wechseln."
  - step: 2
    question: "Ist diese Eindeutigkeit technisch durch Constraint, Index oder vorbereitete Quelle sichtbar gemacht?"
    action_if_yes: "Operation kann als robust oder bedingt sicher eingestuft werden."
    action_if_no: "Einstufung mindestens conditionally_safe; starke Produktionsaussagen vermeiden."
  - step: 3
    question: "Traegt die Quelle nur zur Filterung bei oder liefert sie echte Schreibwerte?"
    action_if_yes: "Bei echten Schreibwerten Kardinalitaetskonflikte besonders streng behandeln."
    action_if_no: "Bei reiner Filterrolle dennoch Duplikate explizit pruefen, weil Produktsysteme unterschiedlich reagieren."
  - step: 4
    question: "Ist das Zielobjekt betriebsheiss oder gross genug, dass Locking, Log oder Replikation kritisch werden?"
    action_if_yes: "Batching, Zeitfenster, Monitoring und Rollback-Pfad einplanen."
    action_if_no: "Direkter Lauf bleibt moeglich, Vorpruefung aber nicht ueberspringen."
  - step: 5
    question: "Weicht das Produktsystem semantisch stark vom SQL-Server-Referenzpfad ab?"
    action_if_yes: "Dialektspezifische Regeln vorrangig lesen und Muster anpassen."
    action_if_no: "SQL-Server-zentrierte Argumentation kann mit begrenzter Kontrasttiefe uebernommen werden."
  - step: 6
    question: "Bleibt nach allen Pruefungen ein impliziter Gewinner bei Mehrfachtreffern moeglich?"
    action_if_yes: "Variante als risky oder avoid einstufen."
    action_if_no: "Variante kann als robust oder conditionally_safe dokumentiert werden."

