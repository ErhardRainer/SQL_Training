metadata:
  topic_slug: "update-with-join"
  as_of_date: "2026-03-08"
  maintained_by: "Codex"
  notes: |
    Offene Quellenluecken:
    - Kein frei zugaenglicher ISO/ANSI-Primartext wurde in diesem Lauf eingebunden. ANSI bleibt deshalb im Artikel eine vorsichtige Meta-Ebene und keine harte Normreferenz.
    - Die MySQL-Referenz dokumentiert fuer Mehrfachtreffer, dass jede passende Zeile einmal aktualisiert wird, legt aber in der hier genutzten Dokumentation keine explizite Gewinnerlogik fuer konfliktierende Quellwerte offen. Der Artikel behauptet deshalb keine deterministische Quellzeilenauswahl.
    - Fuer Oracle wird die aktuelle Direktsyntax gegen 26ai und die historische Gegenfolie gegen 19c abgesichert; Zwischenreleases werden nur indirekt mitgedacht.

