claims_register:
  - claim_id: "C1"
    claim: "Die sichtbare Schreiboberflaeche fuer joined updates unterscheidet sich materiell zwischen SQL Server, PostgreSQL, Oracle und MySQL; es gibt keine portable Einheitsform, auf die der Artikel sich verlassen darf."
    supported_by:
      - system: "SQLServer"
        source_title: "UPDATE (Transact-SQL)"
        url: "https://learn.microsoft.com/en-us/sql/t-sql/queries/update-transact-sql?view=sql-server-ver16"
      - system: "PostgreSQL"
        source_title: "PostgreSQL 18 Documentation - UPDATE"
        url: "https://www.postgresql.org/docs/18/sql-update.html"
      - system: "Oracle"
        source_title: "Oracle AI Database 26 SQL Language Reference - UPDATE"
        url: "https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/UPDATE.html"
      - system: "MySQL"
        source_title: "MySQL 8.4 Reference Manual - UPDATE Statement"
        url: "https://dev.mysql.com/doc/refman/8.4/en/update.html"
    confidence: "high"
    article_section: "Was das Problem eigentlich ist"

  - claim_id: "C2"
    claim: "SQL Server stuft `UPDATE ... FROM` ohne deterministische Quellzuordnung als undefiniert ein."
    supported_by:
      - system: "SQLServer"
        source_title: "UPDATE (Transact-SQL)"
        url: "https://learn.microsoft.com/en-us/sql/t-sql/queries/update-transact-sql?view=sql-server-ver16"
    confidence: "high"
    article_section: "Deep Dive des fuehrenden Systems"

  - claim_id: "C3"
    claim: "In SQL Server bleiben exklusive Schreibsperren fuer Datenaenderungen bis zum Transaktionsende erhalten; Row Versioning reduziert Lesesperren, hebt Schreibsperren aber nicht auf."
    supported_by:
      - system: "SQLServer"
        source_title: "Transaction locking and row versioning guide - SQL Server"
        url: "https://learn.microsoft.com/en-us/sql/relational-databases/sql-server-transaction-locking-and-row-versioning-guide?view=sql-server-ver16"
    confidence: "high"
    article_section: "Welche Rolle Indizes, Constraints, Logging und Locks spielen"

  - claim_id: "C4"
    claim: "PostgreSQL verlangt bei `UPDATE ... FROM` faktisch, dass der Join pro Zielzeile hoechstens eine Ausgaberow erzeugt; sonst wird nur eine nicht gut vorhersagbare Join-Zeile verwendet."
    supported_by:
      - system: "PostgreSQL"
        source_title: "PostgreSQL 18 Documentation - UPDATE"
        url: "https://www.postgresql.org/docs/18/sql-update.html"
    confidence: "high"
    article_section: "Die wichtigste praktische Unterscheidung"

  - claim_id: "C5"
    claim: "PostgreSQL dokumentiert fuer grosse Updates betriebliche Nebenwirkungen wie Table Bloat, Replica Lag und Lock Contention und empfiehlt in solchen Faellen kleinere Batches."
    supported_by:
      - system: "PostgreSQL"
        source_title: "PostgreSQL 18 Documentation - UPDATE"
        url: "https://www.postgresql.org/docs/18/sql-update.html"
    confidence: "high"
    article_section: "Wovon Verhalten, Risiko und Kosten abhaengen"

  - claim_id: "C6"
    claim: "MySQL 8.4 behandelt joined updates ueber die Multi-Table-Update-Form; jede passende Zeile wird einmal aktualisiert, und `ORDER BY` sowie `LIMIT` sind in dieser Form nicht erlaubt."
    supported_by:
      - system: "MySQL"
        source_title: "MySQL 8.4 Reference Manual - UPDATE Statement"
        url: "https://dev.mysql.com/doc/refman/8.4/en/update.html"
    confidence: "high"
    article_section: "Was das Problem eigentlich ist"

  - claim_id: "C7"
    claim: "MySQL warnt bei Multi-Table-Updates mit InnoDB-Foreign-Keys vor moeglichen Optimizer-Reihenfolgen, die zum Fehlschlag und Rollback fuehren; offiziell empfohlen wird dann ein Single-Table-Update mit `ON UPDATE`-Kaskade."
    supported_by:
      - system: "MySQL"
        source_title: "MySQL 8.4 Reference Manual - UPDATE Statement"
        url: "https://dev.mysql.com/doc/refman/8.4/en/update.html"
    confidence: "high"
    article_section: "Welche Rolle Indizes, Constraints, Logging und Locks spielen"

  - claim_id: "C8"
    claim: "Oracle AI Database 26ai unterstuetzt direkte Joins in `UPDATE`; dieselbe Zielzeile darf dabei hoechstens einmal geaendert werden, sonst entsteht `ORA-30926`."
    supported_by:
      - system: "Oracle"
        source_title: "Oracle AI Database 26 SQL Language Reference - UPDATE"
        url: "https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/UPDATE.html"
      - system: "Oracle"
        source_title: "Oracle AI Database 26 New Features - Direct Joins for UPDATE and DELETE Statements"
        url: "https://docs.oracle.com/en/database/oracle/oracle-database/26/nfcoa/appdev_sql.html"
    confidence: "high"
    article_section: "Oracle als starker Kontrastfall"

  - claim_id: "C9"
    claim: "Oracle Database 19c stützt das Thema ueber Subqueries ab, die fuer jede aktualisierte Zielzeile genau eine Rueckgabezeile liefern muessen."
    supported_by:
      - system: "Oracle"
        source_title: "Oracle Database 19c SQL Language Reference - UPDATE"
        url: "https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/UPDATE.html"
    confidence: "high"
    article_section: "Oracle als starker Kontrastfall"

  - claim_id: "C10"
    claim: "Oracle muss versionsscharf gelesen werden: 26ai kennt direkte Joins in `UPDATE`, waehrend 19c das Thema ueber exakt-eine-Zeile-Subqueries abbildet."
    supported_by:
      - system: "Oracle"
        source_title: "Oracle AI Database 26 SQL Language Reference - UPDATE"
        url: "https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/UPDATE.html"
      - system: "Oracle"
        source_title: "Oracle Database 19c SQL Language Reference - UPDATE"
        url: "https://docs.oracle.com/en/database/oracle/oracle-database/19/sqlrf/UPDATE.html"
    confidence: "high"
    article_section: "Oracle als starker Kontrastfall"

