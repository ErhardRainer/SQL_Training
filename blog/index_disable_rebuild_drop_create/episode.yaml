systems:
  SQLServer:
    role: "lead"
    reason: "SQL Server ist hier das Fuehrungssystem, weil es als eines der wenigen grossen Systeme einen echten DISABLE-Zustand fuer Indizes bietet und die Dokumentation die Unterschiede zwischen DISABLE, REBUILD, DROP und CREATE WITH DROP_EXISTING sehr klar beschreibt."
  PostgreSQL:
    role: "contrast_strong"
    reason: "PostgreSQL ist der wichtigste Kontrast fuer Systeme ohne DISABLE-Pfad: dieselbe Problemklasse wird dort ueber REINDEX sowie CREATE oder DROP INDEX, jeweils auch concurrent-faehig, geloest."
  Oracle:
    role: "contrast_strong"
    reason: "Oracle zeigt mit UNUSABLE und INVISIBLE zwei deutlich verschiedene Zustaende und macht damit besonders sichtbar, dass 'nicht vom Optimizer benutzt' und 'nicht gewartet' nicht dasselbe sind."
  MySQL:
    role: "contrast"
    reason: "MySQL bringt mit INVISIBLE und InnoDB-Online-DDL eine andere Praxis mit: Reads lassen sich gefahrlos testen, aber die Schreiblast verschwindet erst wirklich durch DROP."
  ANSI95:
    role: "meta"
    reason: "ANSI bleibt Meta-Ebene und trennt Problemklasse von Produktausdruck."

