article:
  title: "Index Disable + Rebuild vs. Drop + Create: Wann welche Strategie sinnvoll ist"
  slug: "index_disable_rebuild_drop_create"
  topic_number: 62
  as_of_date: "2026-03-09"
  status: "reviewed"
  language: "de"
  series: "SQL-Mastery: Entfessle die Macht der Daten"
  leading_system: "SQLServer"
  canonical_label: "Index Disable + Rebuild vs. Drop + Create"
  thesis: "Disable plus Rebuild und Drop plus Create beantworten nicht dieselbe Frage. Disable oder ein aehnlicher definitionserhaltender Zustand ist stark, wenn dieselbe Indexdefinition spaeter kontrolliert zurueckkehren soll. Drop plus Create ist die sauberere Standardform, sobald Definition, Optionen, Speicherort oder Rollback-Modell bewusst neu festgelegt werden muessen."
  summary_goal: "Der Artikel soll dieselbe Problemklasse als vier Datenbankkulturen lesbar machen: SQL Server mit echtem DISABLE, Oracle mit UNUSABLE und INVISIBLE, PostgreSQL mit REINDEX oder DROP/CREATE und MySQL mit INVISIBLE sowie Online-DDL fuer CREATE oder DROP."
  audience:
    - "Fortgeschrittene SQL-Anwender"
    - "DBA"
    - "Data Engineers"
    - "Architekten fuer Datenplattformen"
  tone:
    intro_dialog: "humorous_but_not_banal"
    body: "technical_precise"
    ending: "respectful_reconciliation"

