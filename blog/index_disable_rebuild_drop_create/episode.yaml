risk_classes:
  robust:
    description: "Die spaetere Zieldefinition ist bereits klar, der Rueckweg ist skript- oder metadatensauber vorbereitet, und der gewaehlte Pfad passt zur Indexart und zur Betriebsrealitaet."
    examples:
      - "SQL Server: einzelner nonclustered Index mit unveraenderter Definition wird fuer einen Bulk-Load deaktiviert und danach gezielt rebuildet."
      - "PostgreSQL: derselbe Index soll in der Definition bleiben und wird per REINDEX, bei Live-Traffic bevorzugt concurrent, neu aufgebaut."
      - "Oracle: UNUSABLE plus REBUILD ONLINE fuer einen nicht constraint-kritischen Bulk-Load."
    refinements:
      - "definition_preserving"
      - "script_backed_recreate"
  conditionally_safe:
    description: "Die Strategie ist vertretbar, aber nur mit vollstaendigem DDL-Skript, klarer Abhaengigkeitenkarte und bewusster Wahl fuer online oder offline."
    examples:
      - "DROP plus CREATE mit vollstaendig versionierter Definition und bewusstem Maintenance-Fenster."
      - "SQL Server CREATE INDEX WITH DROP_EXISTING bei definitorischen Aenderungen."
      - "MySQL CREATE oder DROP eines sekundaren InnoDB-Indexes unter Live-Traffic mit gepruefter Online-DDL-Unterstuetzung."
    refinements:
      - "live_traffic_sensitive"
      - "definition_changes"
  risky:
    description: "Der Pfad kann funktionieren, aber Abhaengigkeiten, Lock-Folgen oder unvollstaendige DDL-Rekonstruktion machen ihn fehlertraechtig."
    examples:
      - "SQL Server: clustered Index auf einer aktiven Tabelle deaktivieren."
      - "PostgreSQL: fehlgeschlagener concurrent Build laesst einen INVALID-Index mit Update-Overhead zurueck."
      - "Oracle: UNUSABLE bei einem eindeutigkeitsrelevanten Index ohne Kenntnis der Constraint-Folgen."
    refinements:
      - "dependency_blind"
      - "blast_radius_underestimated"
  avoid:
    description: "Der Ansatz verwechselt Optimizer-Sichtbarkeit mit Schreibkosten, verzichtet auf sauberes DDL oder ignoriert den Objektzustand der Tabelle."
    examples:
      - "MySQL oder Oracle INVISIBLE als vermeintliche Schreiboptimierung behandeln."
      - "DROP plus CREATE ohne vollstaendiges Recreate-Skript, Optionen, Fillfactor, Compression oder Tablespace-Angaben."
      - "DISABLE auf Verdacht ueber alle Indizes einer Produktions-Tabelle, ohne clustered/constraint-bezogene Unterschiede zu pruefen."
    refinements:
      - "visibility_is_not_disable"
      - "definition_lost"

preflight_checks:
  - id: "P1"
    question: "Soll exakt dieselbe Indexdefinition spaeter wieder aktiv sein, oder aendert sich Key, INCLUDE, Filter, Compression, Filegroup oder Tablespace?"
    generic_intent: "Definitionserhalt gegen bewusste Neudefinition trennen"
    query_pattern: "Vollstaendige DDL des Indexes inklusive Optionen und Platzierung erfassen, bevor ueber DISABLE, REBUILD, REINDEX oder DROP entschieden wird"
    purpose: "Verhindern, dass DROP plus CREATE aus Erinnerung rekonstruiert werden muss"
    expected_signal: "Die exakte Definition liegt als Skript oder Metadatenexport vor"
    per_system:
      SQLServer:
        natural_form: "Indexdefinition ueber sys.indexes, sys.index_columns und bestehende Skripte erfassen; bei definitorischen Aenderungen CREATE INDEX WITH DROP_EXISTING in Betracht ziehen"
        protection_pattern: "Definition vor dem ersten Eingriff versionieren"
        idiomatic_solution: "ALTER INDEX REBUILD nur fuer unveraenderte Definitionen; ansonsten CREATE INDEX ... WITH (DROP_EXISTING = ON)"
        safe_pattern: "Vorher DDL und Compression explizit sichern"
        working_style_note: "SQL Server hat einen echten definitionserhaltenden Pfad, aber nicht fuer jede Indexart denselben Blast Radius"
        pitfall: "DROP plus CREATE aus Erinnerung verliert Optionen schneller als erwartet"
      PostgreSQL:
        natural_form: "CREATE INDEX-Definition ueber pg_indexes sichern und dann zwischen REINDEX und neuer CREATE INDEX-Definition unterscheiden"
        protection_pattern: "Indexdef vor einem Drop aus pg_indexes sichern"
        idiomatic_solution: "Gleiche Definition: REINDEX; neue Definition: CREATE INDEX, unter Live-Traffic meist CONCURRENTLY"
        safe_pattern: "Concurrent-Pfade nur mit ihren Caveats einplanen"
        working_style_note: "PostgreSQL kennt keinen echten DISABLE-Zustand fuer normale Indizes"
        pitfall: "Ohne gesichertes indexdef-Skript wird DROP plus CREATE unnoetig riskant"
      Oracle:
        natural_form: "DDL ueber DBMS_METADATA und USER_INDEXES sichern; UNUSABLE nur fuer definitionserhaltende Faelle, INVISIBLE fuer reine Read-Tests"
        protection_pattern: "UNUSABLE und INVISIBLE bewusst unterscheiden"
        idiomatic_solution: "Gleiche Definition: REBUILD; neue Definition oder neue Speicherattribute: CREATE INDEX"
        safe_pattern: "Vorher Status, Sichtbarkeit und Uniqueness pruefen"
        working_style_note: "Oracle trennt Segmentzustand und Optimizer-Sichtbarkeit klarer als viele Teams erwarten"
        pitfall: "INVISIBLE ist keine Schreibentlastung"
      MySQL:
        natural_form: "SHOW CREATE TABLE und INFORMATION_SCHEMA.STATISTICS als Ausgangspunkt fuer die exakte Rekonstruktion verwenden"
        protection_pattern: "Vor DROP immer die aktuelle Tabellen-DDL sichern"
        idiomatic_solution: "INVISIBLE nur zum Testen, CREATE oder DROP fuer echte Strukturveraenderungen"
        safe_pattern: "InnoDB-Online-DDL-Faehigkeit fuer das konkrete Vorhaben pruefen"
        working_style_note: "MySQLs INVISIBLE ist ein Testwerkzeug fuer Reads, kein DISABLE-Ersatz"
        pitfall: "Wer INVISIBLE als spaeteren Schreibvorteil liest, entscheidet auf der falschen Achse"

  - id: "P2"
    question: "Ist der betroffene Index clustered, PK- oder UNIQUE-gebunden oder haengen weitere Objekte und FKs daran?"
    generic_intent: "Blast Radius und Constraint-Folgen vorab sichtbar machen"
    query_pattern: "Indexart, Constraint-Bezug und abhaengige Objekte vor jedem disable- oder drop-nahen Schritt inventarisieren"
    purpose: "Verhindern, dass ein lokaler Eingriff die Tabelle oder referenzierende Objekte ungewollt lahmlegt"
    expected_signal: "Abhaengigkeiten und Rueckweg sind dokumentiert"
    per_system:
      SQLServer:
        natural_form: "sys.indexes, sys.key_constraints, sys.foreign_keys und abhaengige Views gemeinsam betrachten"
        protection_pattern: "Clustered, PK- und UNIQUE-Indizes getrennt von isolierten nonclustered Indizes behandeln"
        idiomatic_solution: "DISABLE nur dort verwenden, wo die Tabelle selbst nicht unzugaenglich wird"
        safe_pattern: "Vor DISABLE die FK- und Constraint-Folgen explizit pruefen"
        working_style_note: "Bei SQL Server ist clustered versus nonclustered die zentrale Sicherheitslinie"
        pitfall: "Ein deaktivierter clustered Index nimmt der Tabelle den normalen DML-Zugriff"
      PostgreSQL:
        natural_form: "pg_constraint, pg_index und pg_class fuer indexgebundene Constraints und invalid states lesen"
        protection_pattern: "Constraint-tragende Indizes nicht wie austauschbare Zusatzindizes behandeln"
        idiomatic_solution: "Fuer constraint-nahe Faelle eher REINDEX als DROP erwaegen"
        safe_pattern: "CONCURRENTLY nur mit den dokumentierten Einschraenkungen verwenden"
        working_style_note: "PostgreSQL blockiert bei normalem DROP INDEX deutlich haerter als viele vermuten"
        pitfall: "DROP INDEX CONCURRENTLY funktioniert nicht fuer PK- oder UNIQUE-traegende Indizes"
      Oracle:
        natural_form: "USER_INDEXES und USER_CONSTRAINTS zusammen lesen, dazu STATUS, VISIBILITY und UNIQUENESS"
        protection_pattern: "UNUSABLE bei Unique-Enforcement nur mit voller Kenntnis der DML-Folgen"
        idiomatic_solution: "INVISIBLE fuer Tests, UNUSABLE fuer Bulk-Load- oder Maintenance-first-Faelle"
        safe_pattern: "SKIP_UNUSABLE_INDEXES und Constraint-Typ vorab einordnen"
        working_style_note: "Oracle erlaubt DML trotz UNUSABLE nur unter klaren Bedingungen"
        pitfall: "Eindeutigkeitsrelevante unusable Indizes koennen DML mit Fehlern beenden"
      MySQL:
        natural_form: "INFORMATION_SCHEMA.STATISTICS und SHOW CREATE TABLE fuer PK-, UNIQUE- und InnoDB-Kontext lesen"
        protection_pattern: "Explizite und implizite PK-Rolle des Indexes vor INVISIBLE pruefen"
        idiomatic_solution: "Sekundaere Indizes anders behandeln als Primary-Key-nahe Strukturen"
        safe_pattern: "Read-Test mit INVISIBLE nur dort, wo der Index nicht faktisch die PK-Rolle uebernimmt"
        working_style_note: "InnoDB erlaubt nicht jeden Sichtbarkeitswechsel auf jedem Index"
        pitfall: "Ein faktischer Primary-Key-Index kann nicht einfach invisible werden"

  - id: "P3"
    question: "Welches Online- oder Offline-Fenster ist realistisch, und wie teuer ist der gewaehlte Rueckweg unter Live-Traffic?"
    generic_intent: "Lock- und Laufzeitmodell vor dem Eingriff mitdenken"
    query_pattern: "Fuer das konkrete System pruefen, ob Rebuild, Reindex, Create oder Drop online, concurrent oder nur offline realistisch ist"
    purpose: "Wartungsfenster und Nutzerverkehr gegen die Strategie abgleichen"
    expected_signal: "Online- oder Offline-Faehigkeit ist fuer den konkreten Indextyp und das konkrete Statement geklaert"
    per_system:
      SQLServer:
        natural_form: "Online-Richtlinien fuer ALTER INDEX REBUILD und CREATE INDEX WITH DROP_EXISTING gegen Indextyp und Tabellenzustand pruefen"
        protection_pattern: "Disabled clustered Indizes nie als online-faehig annehmen"
        idiomatic_solution: "Nichtclustered same-definition-Faelle mit REBUILD, definitorische Aenderungen mit DROP_EXISTING planen"
        safe_pattern: "Endlock, Zusatzplatz und DML-Mehrarbeit bei Online-Rebuilds mit einkalkulieren"
        working_style_note: "Online ist kein Synonym fuer kostenlos"
        pitfall: "Disabled clustered Indizes muessen offline rebuildet werden"
      PostgreSQL:
        natural_form: "Zwischen normalem REINDEX oder CREATE INDEX und den CONCURRENTLY-Varianten bewusst waehlen"
        protection_pattern: "Mehrarbeit und moegliche INVALID-Reste bei concurrent paths mitplanen"
        idiomatic_solution: "Gleiche Definition unter Live-Traffic bevorzugt per REINDEX INDEX CONCURRENTLY"
        safe_pattern: "Fehlgeschlagene concurrent Builds aktiv bereinigen"
        working_style_note: "Concurrent vermeidet Write-Blocking, kostet aber mehr Zeit und Arbeit"
        pitfall: "INVALID-Indizes koennen trotz Fehlschlag weiter Update-Overhead erzeugen"
      Oracle:
        natural_form: "REBUILD ONLINE nur fuer unterstuetzte Indextypen und nicht als pauschalen Default verwenden"
        protection_pattern: "Online-Faehigkeit und Indextyp gemeinsam pruefen"
        idiomatic_solution: "UNUSABLE plus REBUILD ONLINE dort, wo DML waehrend des Rebuilds weiterlaufen muss"
        safe_pattern: "Bei grossen CREATE-Pfaden Logging- und Backup-Konsequenzen bewusst einplanen"
        working_style_note: "Oracle gibt viele Freiheitsgrade, verlangt aber genaue Typ- und Constraint-Pruefung"
        pitfall: "Nicht jeder Indextyp ist online rebuildbar"
      MySQL:
        natural_form: "InnoDB-Online-DDL-Tabelle fuer sekundare Indexoperationen gegen CREATE oder DROP auf dem Zielobjekt pruefen"
        protection_pattern: "Permits Concurrent DML nicht mit Nullkosten verwechseln"
        idiomatic_solution: "DROP oder CREATE sekundarer Indizes als In-Place-Operation mit Live-DML einplanen, wenn die Engine es traegt"
        safe_pattern: "Bei Bedarf erst INVISIBLE fuer Read-Test, dann DROP fuer echte Schreibentlastung"
        working_style_note: "MySQL ist bei Online-DDL oft pragmatisch, aber semantisch schmaler"
        pitfall: "INVISIBLE spart keine Schreibarbeit"

  - id: "P4"
    question: "Ist der Rueckfallpfad terminierbar, idempotent und fuer das Team nachvollziehbar?"
    generic_intent: "Operative Kontrollierbarkeit statt heroischer Einmalaktion sichern"
    query_pattern: "Rueckkehr in den Sollzustand als kleines Ablaufmuster mit Terminierung, Flag-Reset oder explizitem Recreate-Skript festhalten"
    purpose: "Verhindern, dass ein temporaerer Zustand zum Dauerzustand wird"
    expected_signal: "Es existiert eine kurze, versionierte Arbeitsanweisung fuer Rueckbau oder Wiederaktivierung"
    per_system:
      SQLServer:
        natural_form: "Disable-Rebuild- oder DROP_EXISTING-Skelett mit klarer Rueckkehrlogik festhalten"
        protection_pattern: "Falls Kompression genutzt wird, DATA_COMPRESSION explizit in den Rebuild aufnehmen"
        idiomatic_solution: "Rebuild-Statement vor dem Disable fertig haben"
        safe_pattern: "Bei Batch-Loads Terminierungsbedingung und Nachaktivierung im selben Runbook notieren"
        working_style_note: "SQL Server straft vergessene Rueckkehrschritte sichtbarer als viele Teams erwarten"
        pitfall: "Disabled Indizes bleiben disabled, bis jemand sie wirklich rebuilt oder droppt"
      PostgreSQL:
        natural_form: "Fuer concurrent paths den Umgang mit INVALID-Indizes und erneuten Builds vorher definieren"
        protection_pattern: "Drop-and-retry oder REINDEX INDEX CONCURRENTLY als dokumentierten Rueckfallpfad festlegen"
        idiomatic_solution: "Reindex- oder Create-Skript inklusive Bereinigungsschritt versionieren"
        safe_pattern: "Concurrent-Retries nicht improvisieren"
        working_style_note: "Die Hauptfrage ist hier weniger 'disable oder drop' als 'welcher Rueckweg bleibt unter Last kontrollierbar?'"
        pitfall: "Abgebrochene concurrent Runs ohne Cleanup lassen technischen Muell zurueck"
      Oracle:
        natural_form: "UNUSABLE, REBUILD ONLINE und ggf. VISIBLE oder INVISIBLE als klaren Ablauf dokumentieren"
        protection_pattern: "Bei NOLOGGING-Create den noetigen Backup-Schritt mit aufnehmen"
        idiomatic_solution: "Segmentzustand und Optimizer-Sichtbarkeit bewusst getrennt rueckfuehren"
        safe_pattern: "Nach einem Create ohne Logging Ruecksicherungspfad klar benennen"
        working_style_note: "Oracle bietet viele Hebel, aber sie brauchen ein sauberes Runbook"
        pitfall: "Ein wieder nutzbarer Index ist noch kein vollstaendig betriebsbereiter Rueckfallpfad"
      MySQL:
        natural_form: "VISIBLE oder INVISIBLE fuer Tests, CREATE oder DROP fuer echte Strukturwechsel mit klarer Terminierung festhalten"
        protection_pattern: "SHOW CREATE TABLE vorab sichern und nachher erneut verifizieren"
        idiomatic_solution: "Read-Test und Write-Entlastung als zwei getrennte Schritte planen"
        safe_pattern: "Bei grossen Tabellen den Recreate-Pfad nicht nur technisch, sondern auch zeitlich budgetieren"
        working_style_note: "MySQL verlangt weniger Objektzustaende, aber mehr Klarheit ueber das Ziel des Eingriffs"
        pitfall: "Testzustand und Produktivzustand werden leicht verwechselt, wenn INVISIBLE und DROP als dasselbe behandelt werden"

decision_model:
  - step: 1
    question: "Soll spaeter exakt dieselbe Definition zurueckkehren?"
    action_if_yes: "Definitionserhaltende Pfade wie DISABLE plus REBUILD, REINDEX oder UNUSABLE plus REBUILD pruefen."
    action_if_no: "Script-first Drop/Create oder CREATE INDEX WITH DROP_EXISTING bevorzugen."
  - step: 2
    question: "Ist der Index clustered, constraint-gebunden oder haengt die Tabellenverfuegbarkeit direkt daran?"
    action_if_yes: "Disable-nahe Pfade stark einschaenken; Blast Radius und Rueckweg zuerst klaeren."
    action_if_no: "Ein temporaerer definitionserhaltender Zustand bleibt im Rennen."
  - step: 3
    question: "Braucht das System waehrend der Operation schreibenden Live-Traffic?"
    action_if_yes: "Online-, concurrent- oder in-place-Pfade je System gezielt waehlen und deren Zusatzkosten einplanen."
    action_if_no: "Offline-Rebuild oder geplantes Drop/Create kann die ehrliche und kuerzere Form sein."
  - step: 4
    question: "Ist das Recreate-Skript vollstaendig genug, um Optionen, Compression und Platzierung verlustfrei wiederherzustellen?"
    action_if_yes: "DROP plus CREATE oder DROP_EXISTING ist operativ kontrollierbar."
    action_if_no: "Kein DROP ohne vorab gesicherte Definition."
  - step: 5
    question: "Geht es nur um einen Read-Test oder wirklich um weniger Schreibkosten?"
    action_if_yes: "Read-Test: INVISIBLE in Oracle oder MySQL; Schreibkosten senken: nur ein nicht gewarteter oder gedroppter Index hilft."
    action_if_no: "Strategie weiter auf Definitionserhalt oder bewusste Neudefinition zuschneiden."

