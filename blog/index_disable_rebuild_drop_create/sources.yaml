claims_register:
  - claim_id: "C1"
    claim: "In SQL Server verhindert ein deaktivierter Index den Zugriff auf den Index; bei einem deaktivierten clustered Index ist auch die zugrunde liegende Tabellendatenmenge fuer normale DML-Zugriffe nicht mehr verfuegbar. Die Definition bleibt in den Metadaten erhalten."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N2"
      - "N5"
    supported_by:
      - system: "SQLServer"
        source_title: "Disable indexes and constraints"
        url: "https://learn.microsoft.com/en-us/sql/relational-databases/indexes/disable-indexes-and-constraints?view=sql-server-ver17"
    confidence: "high"
    article_section: "5. Was intern eigentlich passiert"

  - claim_id: "C2"
    claim: "SQL Server pflegt einen deaktivierten Index nicht weiter; das Deaktivieren eines UNIQUE- oder clustered Indexes kann PK-, UNIQUE- und FOREIGN-KEY-Abhaengigkeiten mit betreffen, und nach dem Rebuild muessen bestimmte Constraints manuell wieder aktiviert werden."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N6"
    supported_by:
      - system: "SQLServer"
        source_title: "Disable indexes and constraints"
        url: "https://learn.microsoft.com/en-us/sql/relational-databases/indexes/disable-indexes-and-constraints?view=sql-server-ver17"
      - system: "SQLServer"
        source_title: "Enable indexes and constraints"
        url: "https://learn.microsoft.com/en-us/sql/relational-databases/indexes/enable-indexes-and-constraints?view=sql-server-ver17"
    confidence: "high"
    article_section: "8. Welche Rolle Indizes, Constraints, Logging und Locks spielen"

  - claim_id: "C3"
    claim: "In SQL Server kann ein deaktivierter nonclustered Index online rebuildet werden, solange kein deaktivierter clustered Index beteiligt ist; ein deaktivierter clustered Index muss per ALTER INDEX REBUILD oder CREATE INDEX WITH DROP_EXISTING immer offline rebuildet werden."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N5"
      - "N7"
    supported_by:
      - system: "SQLServer"
        source_title: "Disable indexes and constraints"
        url: "https://learn.microsoft.com/en-us/sql/relational-databases/indexes/disable-indexes-and-constraints?view=sql-server-ver17"
      - system: "SQLServer"
        source_title: "Enable indexes and constraints"
        url: "https://learn.microsoft.com/en-us/sql/relational-databases/indexes/enable-indexes-and-constraints?view=sql-server-ver17"
      - system: "SQLServer"
        source_title: "Guidelines for online index operations"
        url: "https://learn.microsoft.com/en-us/sql/relational-databases/indexes/guidelines-for-online-index-operations?view=sql-server-ver17"
    confidence: "high"
    article_section: "6. Deep Dive: SQL Server als fuehrendes System"
  - claim_id: "C4"
    claim: "SQL Server CREATE INDEX ... WITH DROP_EXISTING kann denselben Index neu aufbauen und dabei Spalten, Sortierreihenfolge, Optionen, Partition Scheme oder Filegroup aendern."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N8"
      - "N10"
    supported_by:
      - system: "SQLServer"
        source_title: "CREATE INDEX (Transact-SQL)"
        url: "https://learn.microsoft.com/en-us/sql/t-sql/statements/create-index-transact-sql?view=sql-server-ver17"
    confidence: "high"
    article_section: "10. Die Hauptstrategien sauber eingeordnet"
  - claim_id: "C5"
    claim: "Microsoft dokumentiert, dass DROP_EXISTING beim Neuerstellen eines clustered Indexes auf Tabellen mit nonclustered Indizes performanter sein kann als ein separates DROP INDEX gefolgt von CREATE INDEX, weil die nonclustered Indizes nur einmal rebuildet werden."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N10"
    supported_by:
      - system: "SQLServer"
        source_title: "CREATE INDEX (Transact-SQL)"
        url: "https://learn.microsoft.com/en-us/sql/t-sql/statements/create-index-transact-sql?view=sql-server-ver17"
    confidence: "high"
    article_section: "10. Die Hauptstrategien sauber eingeordnet"
  - claim_id: "C6"
    claim: "In SQL Server bedeutet ein Rebuild physisch ein Drop und Recreate des Indexes; online Rebuilds brauchen zusaetzlichen Platz und verursachen waehrenddessen zusaetzliche Indexpflege fuer jede Datenaenderung."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N7"
    supported_by:
      - system: "SQLServer"
        source_title: "Maintain indexes optimally to improve performance and reduce resource utilization"
        url: "https://learn.microsoft.com/en-us/sql/relational-databases/indexes/reorganize-and-rebuild-indexes?view=sql-server-ver17"
      - system: "SQLServer"
        source_title: "Guidelines for online index operations"
        url: "https://learn.microsoft.com/en-us/sql/relational-databases/indexes/guidelines-for-online-index-operations?view=sql-server-ver17"
    confidence: "high"
    article_section: "8. Welche Rolle Indizes, Constraints, Logging und Locks spielen"
  - claim_id: "C7"
    claim: "In SQL Server geht beim Deaktivieren komprimierter nonclustered Indizes die Kompressionsmetadaten verloren; ein Rebuild ohne explizites DATA_COMPRESSION erzeugt dann einen unkomprimierten Index."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N7"
    supported_by:
      - system: "SQLServer"
        source_title: "Enable indexes and constraints"
        url: "https://learn.microsoft.com/en-us/sql/relational-databases/indexes/enable-indexes-and-constraints?view=sql-server-ver17"
    confidence: "high"
    article_section: "6. Deep Dive: SQL Server als fuehrendes System"
  - claim_id: "C8"
    claim: "PostgreSQL REINDEX baut einen Index aus den Tabellendaten neu auf und ersetzt die alte Kopie; REINDEX CONCURRENTLY vermeidet Locks, die Inserts, Updates oder Deletes verhindern, waehrend ein normaler Reindex Schreibzugriffe sperrt."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N9"
    supported_by:
      - system: "PostgreSQL"
        source_title: "PostgreSQL 18: REINDEX"
        url: "https://www.postgresql.org/docs/18/sql-reindex.html"
    confidence: "high"
    article_section: "10. Die Hauptstrategien sauber eingeordnet"
  - claim_id: "C9"
    claim: "PostgreSQL CREATE INDEX CONCURRENTLY baut ohne Write-Blocking, braucht aber mehr Arbeit und laeuft deutlich laenger; bei Fehlschlaegen kann ein INVALID-Index mit weiterem Update-Overhead zurueckbleiben."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N7"
      - "N9"
    supported_by:
      - system: "PostgreSQL"
        source_title: "PostgreSQL 18: CREATE INDEX"
        url: "https://www.postgresql.org/docs/18/sql-createindex.html"
    confidence: "high"
    article_section: "8. Welche Rolle Indizes, Constraints, Logging und Locks spielen"
  - claim_id: "C10"
    claim: "PostgreSQL DROP INDEX blockiert in der normalen Form mit ACCESS EXCLUSIVE den Tabellenzugriff; DROP INDEX CONCURRENTLY vermeidet das, ist aber fuer PK- oder UNIQUE-traegende Indizes und in mehreren weiteren Situationen nicht verfuegbar."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N9"
    supported_by:
      - system: "PostgreSQL"
        source_title: "PostgreSQL 18: DROP INDEX"
        url: "https://www.postgresql.org/docs/18/sql-dropindex.html"
    confidence: "high"
    article_section: "10. Die Hauptstrategien sauber eingeordnet"
  - claim_id: "C11"
    claim: "Oracle beschreibt unusable indexes als vom Optimizer ignoriert und nicht durch DML gepflegt; ein unusable Index muss rebuilt oder gedroppt und neu erstellt werden, und beim Markieren als UNUSABLE wird das Indexsegment freigegeben."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N4"
      - "N9"
    supported_by:
      - system: "Oracle"
        source_title: "Oracle AI Database 26ai Administrator's Guide: Managing Indexes"
        url: "https://docs.oracle.com/en/database/oracle/oracle-database/26/admin/managing-indexes.html"
      - system: "Oracle"
        source_title: "Oracle AI Database 26ai SQL Language Reference: ALTER INDEX"
        url: "https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ALTER-INDEX.html"
    confidence: "high"
    article_section: "5. Was intern eigentlich passiert"
  - claim_id: "C12"
    claim: "In Oracle koennen DML-Statements trotz unusable Index weiterlaufen, wenn SKIP_UNUSABLE_INDEXES aktiv ist; fuer eindeutigkeitsrelevante unusable Indizes koennen DML-Statements jedoch mit Fehlern enden."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N6"
    supported_by:
      - system: "Oracle"
        source_title: "Oracle AI Database 26ai Administrator's Guide: Managing Indexes"
        url: "https://docs.oracle.com/en/database/oracle/oracle-database/26/admin/managing-indexes.html"
    confidence: "high"
    article_section: "8. Welche Rolle Indizes, Constraints, Logging und Locks spielen"
  - claim_id: "C13"
    claim: "Oracle REBUILD kann einen unusable Index wieder usable machen; ONLINE erlaubt DML waehrend des Rebuilds, gilt aber nicht fuer alle Indexarten."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N7"
      - "N9"
    supported_by:
      - system: "Oracle"
        source_title: "Oracle AI Database 26ai SQL Language Reference: ALTER INDEX"
        url: "https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ALTER-INDEX.html"
    confidence: "high"
    article_section: "10. Die Hauptstrategien sauber eingeordnet"
  - claim_id: "C14"
    claim: "Oracle INVISIBLE ist bewusst etwas anderes als UNUSABLE: der Optimizer ignoriert den Index, aber DML pflegt ihn weiter; Oracle nennt INVISIBLE explizit als Alternative, um das Entfernen eines Indexes vor dem Drop zu testen."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N9"
    supported_by:
      - system: "Oracle"
        source_title: "Oracle AI Database 26ai Administrator's Guide: Managing Indexes"
        url: "https://docs.oracle.com/en/database/oracle/oracle-database/26/admin/managing-indexes.html"
      - system: "Oracle"
        source_title: "Oracle AI Database 26ai SQL Language Reference: CREATE INDEX"
        url: "https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CREATE-INDEX.html"
    confidence: "high"
    article_section: "7. Die wichtigste praktische Unterscheidung"
  - claim_id: "C15"
    claim: "MySQLs INVISIBLE-Indexes sind fuer den Optimizer unsichtbar, bleiben aber in Wartung und Eindeutigkeitswirkung voll aktiv; damit sind sie kein Ersatz fuer einen deaktivierten Index im SQL-Server-Sinn."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N9"
    supported_by:
      - system: "MySQL"
        source_title: "MySQL 8.4 Reference Manual: Invisible Indexes"
        url: "https://dev.mysql.com/doc/refman/8.4/en/invisible-indexes.html"
    confidence: "high"
    article_section: "5. Was intern eigentlich passiert"
  - claim_id: "C16"
    claim: "MySQL CREATE INDEX und DROP INDEX sind auf ALTER TABLE abgebildet; fuer InnoDB koennen sekundare Indexe in-place und mit concurrent DML erstellt oder geloescht werden, wobei der Drop nur Metadaten aendert, das Create aber nicht."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N7"
      - "N9"
    supported_by:
      - system: "MySQL"
        source_title: "MySQL 8.4 Reference Manual: CREATE INDEX Statement"
        url: "https://dev.mysql.com/doc/refman/8.4/en/create-index.html"
      - system: "MySQL"
        source_title: "MySQL 8.4 Reference Manual: DROP INDEX Statement"
        url: "https://dev.mysql.com/doc/refman/8.4/en/drop-index.html"
      - system: "MySQL"
        source_title: "MySQL 8.4 Reference Manual: InnoDB Online DDL Operations"
        url: "https://dev.mysql.com/doc/refman/8.4/en/innodb-online-ddl-operations.html"
    confidence: "high"
    article_section: "10. Die Hauptstrategien sauber eingeordnet"
  - claim_id: "C17"
    claim: "Die systemuebergreifende Standardfrage lautet nicht 'disable oder drop', sondern 'soll die Definition im Katalog resident bleiben oder bewusst aus versionierter DDL neu entstehen?'"
    evidence_level: "inference_based"
    origin_note_ids:
      - "N2"
      - "N4"
      - "N8"
    supported_by:
      - system: "SQLServer"
        source_title: "Disable indexes and constraints"
        url: "https://learn.microsoft.com/en-us/sql/relational-databases/indexes/disable-indexes-and-constraints?view=sql-server-ver17"
      - system: "PostgreSQL"
        source_title: "PostgreSQL 18: REINDEX"
        url: "https://www.postgresql.org/docs/18/sql-reindex.html"
      - system: "Oracle"
        source_title: "Oracle AI Database 26ai Administrator's Guide: Managing Indexes"
        url: "https://docs.oracle.com/en/database/oracle/oracle-database/26/admin/managing-indexes.html"
      - system: "MySQL"
        source_title: "MySQL 8.4 Reference Manual: Invisible Indexes"
        url: "https://dev.mysql.com/doc/refman/8.4/en/invisible-indexes.html"
    confidence: "medium"
    article_section: "2. Warum die intuitive Sicht zu kurz greift"
  - claim_id: "C18"
    claim: "Fuer SQL Server ist Disable plus Rebuild in der Regel die robusteste Standardform nur fuer isolierte nonclustered Indizes mit unveraenderter Definition; clustered, constraint-nahe oder definitionsaendernde Faelle kippen schnell in risky oder conditionally_safe."
    evidence_level: "inference_based"
    origin_note_ids:
      - "N5"
      - "N6"
      - "N10"
    supported_by:
      - system: "SQLServer"
        source_title: "Disable indexes and constraints"
        url: "https://learn.microsoft.com/en-us/sql/relational-databases/indexes/disable-indexes-and-constraints?view=sql-server-ver17"
      - system: "SQLServer"
        source_title: "Enable indexes and constraints"
        url: "https://learn.microsoft.com/en-us/sql/relational-databases/indexes/enable-indexes-and-constraints?view=sql-server-ver17"
      - system: "SQLServer"
        source_title: "CREATE INDEX (Transact-SQL)"
        url: "https://learn.microsoft.com/en-us/sql/t-sql/statements/create-index-transact-sql?view=sql-server-ver17"
    confidence: "medium"
    article_section: "6. Deep Dive: SQL Server als fuehrendes System"
  - claim_id: "C19"
    claim: "Die sichtbare Versionsbasis fuer diesen Artikel ist SQL Server 2022, PostgreSQL 18, Oracle AI Database 26ai und MySQL 8.4."
    evidence_level: "docs_based"
    origin_note_ids: []
    supported_by:
      - system: "SQLServer"
        source_title: "SQL Server 2022 release notes"
        url: "https://learn.microsoft.com/en-us/sql/sql-server/sql-server-2022-release-notes?view=sql-server-ver17"
      - system: "PostgreSQL"
        source_title: "PostgreSQL 18 release notes"
        url: "https://www.postgresql.org/docs/18/release-18.html"
      - system: "Oracle"
