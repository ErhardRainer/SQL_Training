strategy_snippets:
  - id: "SS1"
    strategy: "sqlserver_disable_rebuild_same_definition"
    target_risk_class: "robust"
    snippet: "ALTER INDEX IX_Sales_OrderDate ON dbo.Sales DISABLE;\n-- Bulk-Load oder Batch-Update nur fuer das geplante Wartungsfenster\nALTER INDEX IX_Sales_OrderDate ON dbo.Sales\nREBUILD WITH (ONLINE = ON, DATA_COMPRESSION = PAGE);"
    operational_caveat: "Nur fuer nichtclustered Indizes mit klarer Rueckkehrlogik geeignet; wenn Kompression genutzt wird, muss DATA_COMPRESSION explizit wieder mit angegeben werden."
    evidence_level: "docs_based"
    source_refs:
      - "C3"
      - "C7"
    article_usage:
      section: "10. Die Hauptstrategien sauber eingeordnet"
      style: "code"
  - id: "SS2"
    strategy: "sqlserver_drop_existing_redefinition"
    target_risk_class: "conditionally_safe"
    snippet: "CREATE INDEX IX_Sales_OrderDate\nON dbo.Sales (OrderDate, CustomerID)\nINCLUDE (Status)\nWITH (DROP_EXISTING = ON, ONLINE = ON, DATA_COMPRESSION = PAGE);"
    operational_caveat: "Nur dann robust, wenn die vollstaendige Zieldefinition bereits versioniert ist; bei constraint-nahen Indizes die Vertragsobjekte separat mitdenken."
    evidence_level: "docs_based"
    source_refs:
      - "C4"
      - "C5"
    article_usage:
      section: "10. Die Hauptstrategien sauber eingeordnet"
      style: "code"
  - id: "SS3"
    strategy: "postgresql_reindex_or_create_concurrently"
    target_risk_class: "conditionally_safe"
    snippet: "REINDEX INDEX CONCURRENTLY sales_orderdate_idx;\n-- oder bei neuer Definition:\nCREATE INDEX CONCURRENTLY sales_orderdate_idx_new ON sales (order_date);"
    operational_caveat: "Concurrent-Pfade brauchen mehr Zeit und koennen INVALID-Reste hinterlassen; Cleanup und Terminierung muessen vorab feststehen."
    evidence_level: "docs_based"
    source_refs:
      - "C8"
      - "C9"
    article_usage:
      section: "10. Die Hauptstrategien sauber eingeordnet"
      style: "code"

comparison_tables:
  - id: "CT1"
    title: "Index temporaer aus dem Weg raeumen: Systemvergleich"
    dimensions:
      - "System"
      - "Definition bleibt sichtbar?"
      - "Schreibpflege pausiert?"
      - "Natuerlicher Rueckweg"
      - "Kritischer Fallstrick"
    rows:
      - system: "SQLServer"
        definition_bleibt_sichtbar: "Ja, bei DISABLE"
        schreibpflege_pausiert: "Ja, bei deaktiviertem Index"
        natuerlicher_rueckweg: "REBUILD oder CREATE ... WITH DROP_EXISTING"
        kritischer_fallstrick: "Clustered und constraint-nahe Indizes haben grossen Blast Radius"
      - system: "PostgreSQL"
        definition_bleibt_sichtbar: "Nicht als eigener Disable-Zustand"
        schreibpflege_pausiert: "Nur ueber Rebuild oder Drop/Create indirekt"
        natuerlicher_rueckweg: "REINDEX, CREATE INDEX, DROP INDEX, jeweils ggf. CONCURRENTLY"
        kritischer_fallstrick: "Concurrent-Fails koennen INVALID-Indizes mit Update-Overhead hinterlassen"
      - system: "Oracle"
        definition_bleibt_sichtbar: "Ja, bei UNUSABLE und INVISIBLE"
        schreibpflege_pausiert: "Ja, bei UNUSABLE; nein, bei INVISIBLE"
        natuerlicher_rueckweg: "REBUILD ONLINE oder CREATE"
        kritischer_fallstrick: "INVISIBLE ist kein Ersatz fuer UNUSABLE"
      - system: "MySQL"
        definition_bleibt_sichtbar: "Ja, bei INVISIBLE"
        schreibpflege_pausiert: "Nein, INVISIBLE wird weiter gepflegt"
        natuerlicher_rueckweg: "DROP oder CREATE als ALTER TABLE, bei InnoDB oft online-nahe"
        kritischer_fallstrick: "Read-Test und Write-Entlastung werden leicht verwechselt"
    article_usage:
      section: "Systemvergleich auf einen Blick"
      style: "table"

warning_boxes:
  - id: "WB1"
    title: "Die haeufigste Produktionsfalle"
    message: "Deaktiviere in SQL Server keinen clustered Index auf einer produktiv genutzten Tabelle, nur weil ein grosses Update teuer ist. Du sparst damit nicht nur Indexpflege, sondern nimmst der Tabelle auch ihren normalen DML-Zugriff und zwingst den Rueckweg in einen Offline-Rebuild."
    severity: "high"
    evidence_level: "docs_based"
    source_refs:
      - "C1"
      - "C3"
  - id: "WB2"
    title: "Unsichtbar ist nicht deaktiviert"
    message: "Oracle- und MySQL-INVISIBLE-Indizes sind gute Werkzeuge, um Read-Pfade zu testen. Sie senken aber nicht die laufende Schreibpflege. Wer damit einen Bulk-Write beschleunigen will, optimiert am falschen Ende."
    severity: "high"
    evidence_level: "docs_based"
    source_refs:
      - "C14"
      - "C15"

anti_pattern_blocks:
  - id: "AP1"
    anti_pattern: "Alle Indizes einer grossen Tabelle vorsorglich deaktivieren, ohne clustered, PK- oder UNIQUE-Rolle zu trennen."
    robust_form: "Nur isolierte nonclustered Indizes mit unveraenderter Rueckkehrdefinition temporaer deaktivieren; alle anderen Faelle erst nach Dependency-Map und versionierter Recreate-Definition anfassen."
    rationale: "Der objektlogische Blast Radius ist wichtiger als die gefuehlte Abkuerzung im Wartungsfenster."
    evidence_level: "inference_based"
    source_refs:
      - "C2"
      - "C18"

signature_visual:
  format: "ascii"
  title: "Definition bleibt, Daten fehlen - oder Definition ist ganz weg"
  purpose: "Den Unterschied zwischen definitionserhaltendem Zustand und bewusstem Recreate greifbar machen."
  body: "DISABLE / UNUSABLE\n  -> Definition bleibt im Katalog\n  -> Segment oder Datenpfad ist nicht nutzbar oder nicht gepflegt\n  -> Rueckweg ist REBUILD\n\nDROP\n  -> Definition ist weg\n  -> Rueckweg braucht vollstaendige DDL\n  -> CREATE baut bewusst neu auf\n\nINVISIBLE\n  -> Definition bleibt sichtbar\n  -> Optimizer nutzt den Index nicht\n  -> Schreibpflege laeuft weiter"
  evidence_level: "inference_based"
  source_refs:
    - "C11"
    - "C14"
    - "C15"
  article_usage:
    section: "5. Was intern eigentlich passiert"
    style: "diagram"

