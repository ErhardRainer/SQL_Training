risk_classes:
  robust:
    description: "Die logische Form und die technische Form stimmen ueberein: entweder eine logische Tabelle bleibt durch native Partitionierung erhalten, oder getrennte Tabellen spiegeln echte fachliche Trennung mit klarer Governance."
    examples:
      - "Zeitpartitionierte Orders-Tabelle mit gemeinsamen Reports und planbarem Lifecycle"
      - "Regional getrennte Tabellen mit unterschiedlichen Sicherheits- oder Retention-Regeln"
    refinements:
      - "native_logical_unity"
      - "explicit_data_domains"
  conditionally_safe:
    description: "Das Modell kann tragfaehig sein, braucht aber disziplinierte Governance, moderate Partitions- oder Tabellanzahl und klare Reporting- oder Routing-Regeln."
    examples:
      - "Native Partitionierung mit starkem Wartungsnutzen, aber nur teilweisem Query-Nutzen"
      - "Mehrere Tabellen mit gemeinsamer Reporting-View und strikt automatisierten Migrationsregeln"
    refinements:
      - "maintenance_first"
      - "governed_multi_table"
  risky:
    description: "Die Architektur ist technisch moeglich, aber Routing, Union-Logik, Schema-Drift oder schwacher Pruning-Nutzen erzeugen schnell mehr Kosten als Gewinn."
    examples:
      - "Jahrestabellen nur wegen Volumen"
      - "Native Partitionierung mit zu vielen kleinen Partitionen"
    refinements:
      - "manual_routing_overhead"
      - "misaligned_partition_key"
  avoid:
    description: "Die gewaehlt Form verschiebt ungeloste Probleme nur in andere Schichten und sollte so nicht eingefuehrt werden."
    examples:
      - "Mehrere Tabellen als Performance-Reflex ohne fachliche Trennung und ohne Governance"
      - "Native Partitionierung als Ersatz fuer fehlende Indizes oder schlechte Praedikate"
    refinements:
      - "size_panic_split"
      - "index_substitute"

preflight_checks:
  - id: "P1"
    question: "Bleibt fachlich eine einzige Entitaet erhalten, oder sollen wirklich getrennte Datenraeume entstehen?"
    generic_intent: "Die Architekturfrage vor der DDL klaeren"
    query_pattern: "Reporting-, DML-, Security- und Retention-Anforderungen auf eine gemeinsame oder getrennte Datenoberflaeche abbilden"
    purpose: "Zwischen nativer Partitionierung, mehreren Tabellen und einer normalen Einzeltabelle unterscheiden"
    expected_signal: "Es ist klar, wer Routing, Reporting und Governance spaeter tragen soll"
    per_system:
      SQLServer:
        natural_form: "Partitioned table fuer eine logische Tabelle, partitioned view nur dann, wenn mehrere Basistabellen fachlich schon gesetzt sind"
        protection_pattern: "Lokale Partitioned Views nicht als Default fuer Daten auf demselben Server waehlen"
        idiomatic_solution: "Ein gemeinsames Objekt bevorzugen"
        safe_pattern: "Eine Tabelle mit nativer Partitionierung statt VIEW plus UNION ALL"
        working_style_note: "SQL Server gibt zwei Antworten auf zwei verschiedene Probleme"
        pitfall: "Mehrere Tabellen plus View verschieben DDL und Governance in die Architektur"
      PostgreSQL:
        natural_form: "Erst klarmachen, ob der Parent die natuerliche Oberflaeche bleiben soll"
        protection_pattern: "Declarative Partitioning nicht mit Inheritance- oder UNION-ALL-Architektur verwechseln"
        idiomatic_solution: "Wenn eine Entitaet bleibt, ueber den Parent modellieren"
        safe_pattern: "Virtuelle Root-Tabelle mit echten Partitionen"
        working_style_note: "PostgreSQL beschreibt genau diesen Unterschied besonders klar"
        pitfall: "Alternative Methoden aus Flexibilitaet waehlen, obwohl nur eine Tabelle gemeint ist"
      Oracle:
        natural_form: "Native Partitionierung fuer eine Tabelle nutzen; mehrere Tabellen nur mit bewusst anderer Besitz- oder Sicherheitslogik"
        protection_pattern: "Systempartitionierung oder app-gesteuerte Zielpartitionen nicht mit der Standardform verwechseln"
        idiomatic_solution: "Eine Tabelle mit passender Partitionierungsstrategie"
        safe_pattern: "Range-, List- oder Interval-Partitionierung als DDL des einen Objekts"
        working_style_note: "Oracle trennt stark zwischen transparenter Partitionierung und Sonderformen"
        pitfall: "Manuelle Objektfamilien bauen, obwohl die Daten als eine Tabelle betrieben werden sollen"
      MySQL:
        natural_form: "Pruefen, ob eine Tabelle mit simpler Partitionierung robuster ist als eine Familienarchitektur aus Jahrestabellen"
        protection_pattern: "Engine-Grenzen frueh lesen"
        idiomatic_solution: "Einfaches gemeinsames Objekt bevorzugen"
        safe_pattern: "RANGE COLUMNS fuer eine Tabelle statt Jahr-fuer-Jahr-Tabellen ohne starken Fachgrund"
        working_style_note: "MySQLs engere Grenzen machen mehrere Tabellen nicht automatisch besser"
        pitfall: "Von FK- oder Engine-Grenzen direkt in eine teure Tabellenfamilie zu kippen"

  - id: "P2"
    question: "Traegt derselbe Schluessel sowohl Pruning als auch Lifecycle-Operationen?"
    generic_intent: "Partition Key oder Tabellenschnitt gegen echte Read- und Wartungsmuster pruefen"
    query_pattern: "Typische WHERE-Praedikate, Reporting-Fenster, Archivierung und Purge gegen die geplante Achse halten"
    purpose: "Query-Nutzen und Wartungsnutzen gemeinsam oder getrennt bewerten"
    expected_signal: "Der gewaehlte Schnitt ist nicht nur optisch plausibel, sondern operativ tragfaehig"
    per_system:
      SQLServer:
        natural_form: "Sargierbare Bereichsfilter und spaetere SWITCH-Pfade zusammen pruefen"
        protection_pattern: "Partition Key nicht in YEAR(), CONVERT() oder andere Ausdrucke einpacken"
        idiomatic_solution: "Range-Filter plus geplanter Partition Function- und Scheme-Pfad"
        safe_pattern: "Datumsfenster mit offener Obergrenze und vorbereiteter Randpartition"
        working_style_note: "Pruning und Wartung leben in SQL Server von derselben Disziplin"
        pitfall: "Eine Partition Function hilft nicht, wenn die echten Queries den Key fachlich gar nicht benutzen"
      PostgreSQL:
        natural_form: "EXPLAIN gegen den Parent fahren und echte Bounds pruefen"
        protection_pattern: "Partition Pruning nur dort erwarten, wo Filtersyntax und Partition Key zueinander passen"
        idiomatic_solution: "Zeit- oder Bereichsachsen ueber den Parent sauber formulieren"
        safe_pattern: "Parent-Query mit klaren Grenzen und vorab angelegten Partitionen"
        working_style_note: "PostgreSQL belohnt die eine logische Tabelle dann, wenn Reads und Lifecycle dieselbe Achse teilen"
        pitfall: "Zu viele oder schlecht passende Partitionen machen den Parent teuer"
      Oracle:
        natural_form: "Pruning, Indexwirkung und Exchange- oder Drop-Pfade zusammen denken"
        protection_pattern: "Indexwahl nicht von der Partitionswahl abkoppeln"
        idiomatic_solution: "Zeitachsen als Range- oder Interval-Partitionen und Maintenance zusammen planen"
        safe_pattern: "Pruning-freundlicher Key plus lokale Indexstrategie"
        working_style_note: "Oracle macht dieselbe Achse fuer Query und Wartung besonders sichtbar"
        pitfall: "Guter Partition Key, aber globale Indexfolgen zerstoeren den Betriebsnutzen"
      MySQL:
        natural_form: "Mit EXPLAIN PARTITIONS gegen echte WHERE-Muster pruefen"
        protection_pattern: "Partitionsausdruck schlicht halten"
        idiomatic_solution: "Range- oder List-Grenzen waehlen, die in der Praxis wieder auftauchen"
        safe_pattern: "Einfache Bereichslogik statt komplexer Ausdrucke"
        working_style_note: "In MySQL muss der Nutzen direkt an den Grenzen ablesbar sein"
        pitfall: "Komplexe Partitionsausdruecke machen spaeter jede Erklaerbarkeit schwer"

  - id: "P3"
    question: "Wenn mehrere Tabellen erwogen werden: Kann Schema-Drift, Routing-Luecke und Reporting-Unvollstaendigkeit aktiv geprueft werden?"
    generic_intent: "Den groessten Multi-Table-Fallstrick vor dem Bau sichtbar machen"
    query_pattern: "Metadaten aller betroffenen Tabellen vergleichen und auf fehlende Familienmitglieder oder Spaltenabweichungen pruefen"
    purpose: "Governance-Aufwand messen, bevor aus Trennung eine Dauerlast wird"
    expected_signal: "Die Tabellenfamilie bleibt ueber Deployment-Zyklen hinweg kontrollierbar"
    per_system:
      SQLServer:
        natural_form: "sys.tables und sys.columns fuer die ganze Tabellenfamilie abfragen"
        protection_pattern: "View- und Tabellenfamilien nicht ohne wiederholbare Metadatenpruefung betreiben"
        idiomatic_solution: "Vor jeder neuen Jahrestabelle Spaltenvertrag und CHECK-Logik automatisiert vergleichen"
        safe_pattern: "Spaltensummen, Indexvertrag und Routing-View gemeinsam pruefen"
        working_style_note: "Partitioned Views werden erst mit CHECK-Disziplin und Metadata-Checks belastbar"
        pitfall: "Ein fehlendes Tabellenmitglied oder eine abweichende Spalte frisst den Governance-Gewinn sofort auf"
      PostgreSQL:
        natural_form: "information_schema und pg_catalog gegen die ganze Tabellenfamilie laufen lassen"
        protection_pattern: "Alternative Methoden nur mit expliziter Metadatenhygiene fahren"
        idiomatic_solution: "Bei mehreren Tabellen eine automatisierte Strukturpruefung und eine bewusst gepflegte Reporting-Schicht vorsehen"
        safe_pattern: "Spaltenzaehlung und Objektliste fuer alle Orders-Tabellen vor jedem Release"
        working_style_note: "Gerade weil PostgreSQL sehr flexibel ist, muss Governance sichtbar geplant werden"
        pitfall: "Vererbungs- oder View-Konstrukte wirken leichtgewichtig, bis Migrationen asynchron laufen"
      Oracle:
        natural_form: "USER_TABLES und USER_TAB_COLUMNS gegen die Tabellenfamilie pruefen"
        protection_pattern: "Mehrere Tabellen nur mit bewusstem Betriebshandbuch und DDL-Gleichlauf"
        idiomatic_solution: "Wenn Trennung fachlich real ist, Strukturvertrag und Reporting-Objekte gemeinsam versionieren"
        safe_pattern: "Tabellenfamilie nur mit Metadata-Check und klaren Besitzerregeln"
        working_style_note: "Oracle-Features nehmen viel Wartung aus nativer Partitionierung heraus"
        pitfall: "Trennung ohne Governance fuehrt schnell zu stiller Drift"
      MySQL:
        natural_form: "information_schema.columns ueber die ganze Tabellenfamilie aggregieren"
        protection_pattern: "Jahrestabellen nicht ohne automatische Familienpruefung und View- oder Query-Vertrag betreiben"
        idiomatic_solution: "Vor jedem neuen Mitglied Spaltenzahl, Schluessel und Naming abgleichen"
        safe_pattern: "Metadata-Check zuerst, dann erst Routing- oder Reporting-Code"
        working_style_note: "MySQL verzeiht einfache Modelle eher als improvisierte Familienarchitekturen"
        pitfall: "Die scheinbar einfache Tabellenkopie wird ohne Governance schnell unuebersichtlich"

  - id: "P4"
    question: "Passen Index-, Constraint-, Sicherheits- und Betriebsregeln zur gewaehlten Form?"
    generic_intent: "Technische Nebenbedingungen vor der Entscheidung sichtbar machen"
    query_pattern: "Unique-Regeln, FK-Beziehungen, lokale oder globale Indizes und Wartungsfenster gemeinsam pruefen"
    purpose: "Spaete Ueberraschungen bei Maintenance, Reporting und Deployment vermeiden"
    expected_signal: "Die gewaehlt Architektur kollidiert nicht mit den haertesten Plattformregeln"
    per_system:
      SQLServer:
        natural_form: "Partition Key in Unique-Design und aligned indexes frueh mitdenken"
        protection_pattern: "Bei partitioned views die CHECK-Logik und die UPDATE-Regeln mitlesen"
        idiomatic_solution: "Ein Objekt bevorzugen, solange kein echter Grund fuer Member-Tabellen existiert"
        safe_pattern: "Native Partitionierung mit sauberem Indexvertrag"
        working_style_note: "SQL Server macht Unterschiede zwischen nativer Partitionierung und View-Familien sehr konkret"
        pitfall: "Nicht alignede oder fachlich widerspruechliche Regeln zerstoeren den Betriebsnutzen"
      PostgreSQL:
        natural_form: "Partitionierte Tabellen gegen Parent- und Child-Indexlogik sowie FK- und Update-Verhalten pruefen"
        protection_pattern: "Nicht nur den Parent, sondern die Partitionsfamilie operativ mitdenken"
        idiomatic_solution: "Wenn eine Entitaet bleibt, die Parent-Oberflaeche ernst nehmen"
        safe_pattern: "Deklarative Partitionierung mit bewusstem Partitions- und Indexvertrag"
        working_style_note: "Das Routing in PostgreSQL nimmt Schreiblogik ab, aber nicht die Verantwortung fuer gute Grenzen"
        pitfall: "Zu viele Partitionen oder schwache Indexhygiene machen den Parent teuer"
      Oracle:
        natural_form: "Lokale gegen globale Indizes, Partition Independence und Exchange-Strategien gemeinsam pruefen"
        protection_pattern: "Globale Indexfolgen vor dem ersten Wartungsfenster dokumentieren"
        idiomatic_solution: "Lokale Indizes fuer wartungsnahe Muster bevorzugen"
        safe_pattern: "Native Partitionierung mit bewusstem Index- und Availability-Plan"
        working_style_note: "Oracle gibt viel Macht, aber jede Machtentscheidung bleibt betriebliche Verpflichtung"
        pitfall: "Mehrere Tabellen als Ausweichform zu bauen, obwohl eigentlich nur die Indexfrage ungeklaert war"
      MySQL:
        natural_form: "FK-Grenzen, Unique-Key-Regeln und Engine-Einschraenkungen vorab lesen"
        protection_pattern: "Keine Architektur aufsetzen, die spaeter an dokumentierten InnoDB-Grenzen scheitert"
        idiomatic_solution: "Einfache Partitionierung oder bewusst einfache Einzeltabelle, wenn FKs zentral bleiben"
        safe_pattern: "Eng an den dokumentierten Limits bleiben und Rueckfallpfad offen halten"
        working_style_note: "Die robustere Form in MySQL ist oft die einfacher zu erklaerende"
        pitfall: "Aus einem dokumentierten Limit reflexhaft eine grosse Tabellenfamilie zu bauen"

decision_model:
  - step: 1
    question: "Bleibt fachlich eine einzige Entitaet erhalten?"
    action_if_yes: "Native Partitionierung oder eine normale Einzeltabelle bleiben die primaeren Kandidaten."
    action_if_no: "Mehrere Tabellen duerfen fachlich im Rennen bleiben."
  - step: 2
    question: "Teilen wichtige Reads und Lifecycle-Operationen denselben Schluessel?"
    action_if_yes: "Native Partitionierung wird zu einer starken Option."
    action_if_no: "Nicht automatisch partitionieren; ggf. Einzeltabelle oder bewusst getrennte Tabellen waehlen."
  - step: 3
    question: "Sind Besitz, Sicherheit, Retention oder Deployment-Regeln bewusst unterschiedlich?"
    action_if_yes: "Mehrere Tabellen koennen robust sein, wenn Governance explizit mitgeplant wird."
    action_if_no: "Mehrere Tabellen wirken eher wie manueller Overhead ohne starken Fachgrund."
  - step: 4
    question: "Kann Routing, Reporting und Schema-Gleichlauf automatisiert und geprueft werden?"
    action_if_yes: "Eine Multi-Table-Architektur bleibt conditionally_safe oder robust, je nach Trennschaerfe."
    action_if_no: "Der Fall kippt in risky oder avoid."
  - step: 5
    question: "Passen Plattformregeln fuer Indizes, FKs und Maintenance zur gewaehlten Form?"
    action_if_yes: "Die Architektur kann produktiv geplant werden."
    action_if_no: "Vorher vereinfachen oder die Entscheidung revidieren."

signature_visual:
  preferred_form: "logical_table_vs_manual_routing"
  purpose: "Den Unterschied zwischen engine-gesteuerter Partitionierung und anwendungs- oder view-gesteuertem Routing merkfaehig machen."
  key_message: "Eine partitionierte Tabelle behaelt die logische Einheit; mehrere Tabellen verschieben Verantwortung fuer Routing, Governance und Reporting in Architektur und Betrieb."
  anchor_section: "5. Was intern passiert: eine Tabelle gegen viele Tabellen"

