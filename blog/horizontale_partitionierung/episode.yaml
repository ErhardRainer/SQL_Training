  use_if_present: true
  note_items:
    - id: "N1"
      summary: "Die Kernfrage lautet nicht nur Partitionierung oder nicht, sondern eine partitionierte Tabelle gegen mehrere physisch getrennte Tabellen."
      priority: "must_cover"
      planned_section: "1. Was horizontale Partitionierung hier bedeutet"
      planned_artifact: "article_body"
      handling: "integrate"
      rationale: "Das ist die eigentliche Architekturfrage der Episode."
    - id: "N2"
      summary: "Native Partitionierung soll als eine logische Tabelle mit Teilobjekten sichtbar werden; mehrere Tabellen sind ein anderes Modell."
      priority: "must_cover"
      planned_section: "5. Was intern passiert: eine Tabelle gegen viele Tabellen"
      planned_artifact: "article_body"
      handling: "integrate"
      rationale: "Diese Trennung ist fachlich zentral."
    - id: "N3"
      summary: "Die Leitthese soll betonen, dass mehrere Tabellen nicht automatisch Partitionierung von Hand sind."
      priority: "must_cover"
      planned_section: "2. Warum die intuitive Sicht zu kurz greift"
      planned_artifact: "article_body"
      handling: "integrate"
      rationale: "Der Artikel braucht einen klaren Gegenakzent zum Performance-Reflex."
    - id: "N4"
      summary: "Logische Einheit, physische Verteilung, Routing, Pruning, Wartung, Archivierung und Code-Komplexitaet muessen getrennt werden."
      priority: "must_cover"
      planned_section: "4. Wovon die Wahl abhaengt"
      planned_artifact: "article_body"
      handling: "integrate"
      rationale: "Diese Ebenentrennung verhindert eine zu flache Darstellung."
    - id: "N5"
      summary: "Eine partitionierte Tabelle ist sinnvoll, wenn fachlich eine Entitaet bleibt und Queries ueber das Gesamtobjekt laufen, aber Lebenszyklus und Wartung Teilmengen nutzen."
      priority: "must_cover"
      planned_section: "7. Die wichtigste praktische Unterscheidung"
      planned_artifact: "article_body"
      handling: "integrate"
      rationale: "Das ist die robuste Kernform des Artikels."
    - id: "N6"
      summary: "Mehrere Tabellen sind sinnvoll, wenn Trennung fachlich gewollt ist, mit verschiedenen Besitzern, Sicherheits- oder Retention-Regeln."
      priority: "must_cover"
      planned_section: "10. Die Hauptstrategien sauber eingeordnet"
      planned_artifact: "article_body"
      handling: "integrate"
      rationale: "Der Artikel soll native Partitionierung nicht als alleinige Loesung darstellen."
    - id: "N7"
      summary: "Die Kernwarnung lautet: Mehrere Tabellen sind oft kein Performance-Konzept, sondern ein Modellierungsentscheid mit Folgekosten fuer Query-, ETL- und Anwendungslogik."
      priority: "must_cover"
      planned_section: "7. Die wichtigste praktische Unterscheidung"
      planned_artifact: "article_body"
      handling: "integrate"
      rationale: "Diese Warnung braucht einen sichtbaren Platz als Produktionshinweis."
    - id: "N8"
      summary: "Unterfragen zu DDL, Indizes, Constraints, Reporting, ETL und Deployment sollen explizit in die Tiefenlogik einfliessen."
      priority: "must_cover"
      planned_section: "8. Welche Rolle Indizes, Constraints, Routing, Logging und Betrieb spielen"
      planned_artifact: "article_body"
      handling: "integrate"
      rationale: "Die praktischen Folgekosten muessen konkret werden."
    - id: "N9"
      summary: "PostgreSQL oder Oracle sind als Fuehrungssystem fachlich besonders passend; PostgreSQL betont die logische Parent-Table-Idee am klarsten."
      priority: "must_cover"
      planned_section: "Warum PostgreSQL in dieser Episode fuehrt"
      planned_artifact: "sources"
      handling: "integrate"
      rationale: "Die Fuehrungsentscheidung soll aus dokumentierter Produktlogik kommen."
    - id: "N10"
