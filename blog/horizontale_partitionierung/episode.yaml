article:
  title: "Horizontale Partitionierung: eine partitionierte Tabelle oder mehrere Tabellen?"
  slug: "horizontale_partitionierung"
  topic_number: 61
  as_of_date: "2026-03-09"
  status: "reviewed"
  language: "de"
  series: "SQL-Mastery: Entfessle die Macht der Daten"
  leading_system: "PostgreSQL"
  canonical_label: "Horizontale Partitionierung"
  thesis: "Horizontale Partitionierung ist stark, wenn eine logische Tabelle erhalten bleiben soll und native Partitionierung Pruning, Wartung und Lebenszyklus auf Teilmengen erlaubt. Mehrere physisch getrennte Tabellen sind dagegen ein eigenes Architekturmodell und werden erst dann robust, wenn Trennung, Routing, Governance und Reporting bewusst gewollt sind."
  summary_goal: "Der Artikel soll die Architekturfrage zwischen nativer horizontaler Partitionierung und manuell getrennten Tabellen in vier Datenbankkulturen einordnen."
  audience:
    - "Fortgeschrittene SQL-Anwender"
    - "DBA"
    - "Data Engineers"
    - "Architekten fuer Datenplattformen"
  tone:
    intro_dialog: "humorous_but_not_banal"
    body: "technical_precise"
    ending: "respectful_reconciliation"

