systems:
  SQLServer:
    role: "contrast_strong"
    reason: "SQL Server ist hier ein starker Kontrastpartner, weil Microsoft einerseits native partitioned tables and indexes klar beschreibt und andererseits partitioned views fuer mehrere physische Tabellen kennt. Genau dieser Doppelblick schaerft die Architekturfrage."
  PostgreSQL:
    role: "lead"
    reason: "PostgreSQL fuehrt, weil die Dokumentation die partitionierte Tabelle besonders explizit als virtuelle Root-Tabelle mit echten Partitionen beschreibt und zugleich alternative Methoden wie Inheritance und UNION ALL Views als andere Form mit anderen Eigenschaften einordnet."
  Oracle:
    role: "contrast_strong"
    reason: "Oracle zeigt die reifste Enterprise-Partitionierungsdisziplin und macht sichtbar, wie stark lokale oder globale Indizes, Exchange-Operationen und Partition Independence die Wahl zwischen einer Tabelle und mehreren Tabellen beeinflussen."
  MySQL:
    role: "contrast"
    reason: "MySQL ist fachlich wichtig, weil native horizontale Partitionierung dort klar als Teilung einer Tabelle modelliert wird, die Engine- und FK-Grenzen aber frueh zeigen, wann mehrere Tabellen oder sogar eine einzige nicht partitionierte Tabelle robuster sein koennen."
  ANSI95:
    role: "meta"
    reason: "ANSI bleibt Meta-Ebene und trennt Problemklasse, Produktsyntax und Produktsemantik."

