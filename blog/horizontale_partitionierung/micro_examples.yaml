    strategy: "native_partitioned_table_postgresql"
    target_risk_class: "robust"
    snippet: "CREATE TABLE orders (\n  order_id bigint not null,\n  order_date date not null,\n  customer_id bigint not null\n) PARTITION BY RANGE (order_date);\n\nCREATE TABLE orders_2026_q1\n  PARTITION OF orders\n  FOR VALUES FROM ('2026-01-01') TO ('2026-04-01');\n\n-- Die naechste Partition vor dem neuen Zeitraum anlegen.\n-- Alte Partition erst detachen oder archivieren, wenn das Quartal fachlich abgeschlossen ist."
