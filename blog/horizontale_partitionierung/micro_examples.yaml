warning_boxes:
  - id: "WB1"
    title: "Die haeufigste Produktionsfalle"
    message: "Wenn eine Entitaet fachlich eine Tabelle bleibt, aber das Team sie aus Groessenangst in Jahres- oder Monatstabellen aufspaltet, wandern Routing, UNION-Reporting, Migrationsgleichlauf und Schema-Governance aus der Datenbankstruktur in Deployments und Anwendungscode."
    severity: "high"
    evidence_level: "inference_based"
    source_refs: ["C15"]

anti_pattern_blocks:
  - id: "AP1"
    anti_pattern: "orders_2024, orders_2025 und orders_2026 nur deshalb bauen, weil die Orders-Tabelle gross geworden ist."
    robust_form: "Wenn die Entitaet eine bleibt, eine normale Tabelle oder native Partitionierung nutzen; mehrere Tabellen nur bei echter Trennung von Ownership, Security, Retention oder Deployment."
    rationale: "Die Tabellenfamilie loest kein Query- oder Indexproblem von selbst, sondern fuehrt neue Governance-Pflichten ein."
    evidence_level: "inference_based"
    source_refs: ["C14", "C15", "C16"]

