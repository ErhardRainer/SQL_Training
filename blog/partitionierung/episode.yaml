risk_classes:
  robust:
    description: "Klarer Partition Key, typische Queries filtern entlang dieses Keys, und Wartung oder Lebenszyklus profitieren direkt von Partitionen."
    examples:
      - "Faktentabelle mit Monatsgrenzen, haeufigen Datumsfiltern und planbaren Purge-Fenstern"
      - "Archivfaehige Altpartitionen mit Switch-, Exchange- oder Detach-Muster"
    refinements:
      - "lifecycle_aligned"
      - "pruning_aligned"
  conditionally_safe:
    description: "Partitionierung ist fachlich plausibel, aber Nutzen und Betriebsgewinn haengen an sauberer Vorpruefung, begrenzter Partitionszahl und passender Indexstrategie."
    examples:
      - "Grosse Tabelle mit gemischten Query-Mustern, aber klarem Loesch- oder Archivfenster"
      - "Hot-Cold-Strategie mit wenigen grossen Partitionen und geplanter Nacharbeit an Indizes"
    refinements:
      - "maintenance_first"
      - "mixed_access_patterns"
  risky:
    description: "Der Partition Key passt nur teilweise zu den realen Zugriffen oder die Partitionsgrenzen erzeugen mehr Metadaten- und Betriebsaufwand als Nutzen."
    examples:
      - "Viele Berichte filtern nicht auf den Partition Key"
      - "Zu viele kleine Partitionen mit deutlicher Schieflast"
    refinements:
      - "misaligned_key"
      - "overpartitioned"
  avoid:
    description: "Partitionierung wird hier als Ersatz fuer Datenmodellierung, Indizierung oder Query-Disziplin missbraucht und sollte in dieser Form nicht eingefuehrt werden."
    examples:
      - "Partitionierung nur wegen Tabellenvolumen ohne klares Wartungsmodell"
      - "Partitionierung als Feigenblatt fuer schlechte Indizes oder unscharfe Filter"
    refinements:
      - "no_lifecycle_model"
      - "index_substitute"

preflight_checks:
  - id: "P1"
    question: "Filtern die wichtigsten Leseabfragen natuerlich auf dem geplanten Partition Key?"
    generic_intent: "Pruning-Nutzen gegen partitionierungsblinde Zugriffsmuster pruefen"
    query_pattern: "Top-Reads nach WHERE- und JOIN-Praedikaten inventarisieren und gegen den geplanten Partition Key halten"
    purpose: "Leselogik entlang des Partition Keys nachweisen oder entkraeften"
    expected_signal: "Ein substanzieller Teil der kritischen Abfragen nutzt den Partition Key direkt und sargierbar"
    per_system:
      SQLServer:
        natural_form: "Plan- und DMV-nahe Pruefung der echten Filterpraedikate gegen die Partitionierungsspalte"
        protection_pattern: "Range-Filter als offene Obergrenze formulieren und Funktionen auf der Partitionierungsspalte vermeiden"
        idiomatic_solution: "Gezielte WHERE-Muster auf der Partitionierungsspalte plus Sichtpruefung der angesprochenen Partitionen"
        safe_pattern: "Sargierbarer Datumsbereich statt YEAR- oder CONVERT-Filter"
        working_style_note: "SQL Server belohnt saubere Bereichsfilter durch Partition Elimination, nicht bloss durch vorhandene Partitionen"
        pitfall: "Nicht sargierbare Funktionen auf dem Partition Key machen den gehofften Nutzen unsichtbar"
      PostgreSQL:
        natural_form: "EXPLAIN-nahe Pruefung, ob Declarative Partitioning und Partition Pruning fuer die echten Filter greifen"
        protection_pattern: "Bounds und Datentypen so waehlen, dass Praedikate der Partitionierung entsprechen"
        idiomatic_solution: "Queries auf den Parent richten, aber Filter sauber auf dem Partition Key halten"
        safe_pattern: "Nativer Datums- oder Bereichsfilter statt Ausdruck auf der Partitionierungsspalte"
        working_style_note: "PostgreSQL warnt selbst davor, dass zu viele Partitionen Planung und Speicher verteuern koennen"
        pitfall: "Partitionen helfen wenig, wenn die meisten Reads quer ueber alle Child-Tabellen laufen"
      Oracle:
        natural_form: "Optimizer-nahe Pruefung auf static oder dynamic partition pruning und auf passende lokale oder globale Indexpfade"
        protection_pattern: "Partition Key und Query-Praedikat sauber typisiert halten"
        idiomatic_solution: "Range- und Interval-Muster entlang klarer Zeitgrenzen entwerfen"
        safe_pattern: "Explizite Bounds fuer planbare Wartung oder Interval fuer regelmaessigen Zeitfortschritt, je nach Betriebsmodell"
        working_style_note: "Oracle verbindet Partitionswahl, Pruning und Indexstrategie staerker als viele Teams erwarten"
        pitfall: "Global index maintenance kann den scheinbar einfachen Wartungsvorteil relativieren"
      MySQL:
        natural_form: "Pruefung, ob der Optimizer die Partitionen aus dem WHERE-Ausdruck tatsaechlich auf wenige Grenzen reduzieren kann"
        protection_pattern: "Partitionierungsausdruck einfach und stabil halten"
        idiomatic_solution: "Range- oder List-Muster mit klaren Grenzwerten statt komplexen Ausdruecken"
        safe_pattern: "Schlichte Datums- oder numerische Bereichslogik fuer Partition Pruning"
        working_style_note: "MySQL profitiert vor allem dann, wenn der Partitionsausdruck direkt in den typischen Filtern wieder auftaucht"
        pitfall: "Wenn fast jede Query mehrere oder alle Partitionen liest, bleibt vor allem Verwaltungsaufwand uebrig"

  - id: "P2"
    question: "Gibt es einen klaren Lebenszyklus fuer Laden, Archivieren, Purgen oder Abhaengen ganzer Datenbereiche?"
    generic_intent: "Wartungsnutzen statt blosses Volumendenken pruefen"
    query_pattern: "Retention-Regeln, Ladefenster und Loeschfenster gegen den geplanten Partition Key mappen"
    purpose: "Operativen Gewinn von Sliding Window, Exchange, Detach oder Truncate-Partition sichtbar machen"
    expected_signal: "Die fachlichen Perioden decken sich mit realen Wartungsoperationen"
    per_system:
      SQLServer:
        natural_form: "Pruefen, ob Partition Function, Scheme und Staging-Tabellen ein Switch-In oder Switch-Out sinnvoll tragen"
        protection_pattern: "Leere Sicherheitspartitionen und identische Strukturen fuer Switch-Pfade vorsehen"
        idiomatic_solution: "Sliding-Window-Modell mit vorbereiteter naechster und leerer Randpartition"
        safe_pattern: "Neue Periode splitten, Daten einswitchen, alte Periode ausswitchen"
        working_style_note: "SQL Server ist stark, wenn Lebenszyklus und Strukturvorgaben frueh geplant werden"
        pitfall: "Switch scheitert schnell an nicht ausgerichteten Indizes oder unpassenden Check-Constraints"
      PostgreSQL:
        natural_form: "Pruefen, ob ATTACH und DETACH PARTITION den echten Betriebsfall besser tragen als Massen-DELETE"
        protection_pattern: "Neue Partitionen vorab anlegen und alte gezielt abhaengen"
        idiomatic_solution: "Zeitbasierte Declarative Partitioning-Struktur mit klaren Child-Grenzen"
        safe_pattern: "Detach fuer Archivierung statt grosse DELETE-Wellen"
        working_style_note: "PostgreSQL hebt den Wartungsvorteil groesserer Loeschvorgaenge ausdruecklich hervor"
        pitfall: "Viele kleine Partitionen machen den laufenden Betrieb schwerer als das Purge-Problem"
      Oracle:
        natural_form: "Pruefen, ob Exchange Partition, Interval- oder Reference-Design den Datenlebenszyklus direkt abbildet"
        protection_pattern: "Lokale und globale Indexfolgen fuer Wartungsoperationen bewusst einplanen"
        idiomatic_solution: "Range- oder Interval-Partitionierung entlang der realen Zeitachsen"
        safe_pattern: "Partition Exchange fuer schnelle Lade- oder Archivpfade nur mit passender Index- und Constraint-Strategie"
        working_style_note: "Oracle ist besonders stark, wenn Partitionierung als Wartungsdisziplin und nicht nur als Query-Hoffnung verstanden wird"
        pitfall: "Zu spaet geplante globale Indexabhaengigkeiten machen Maintenance teuer"
      MySQL:
        natural_form: "Pruefen, ob REORGANIZE, TRUNCATE PARTITION oder EXCHANGE PARTITION den Lebenszyklus wirklich vereinfachen"
        protection_pattern: "Storage-Engine-Grenzen und FK-Einschraenkungen frueh lesen"
        idiomatic_solution: "Klare Zeitfenster mit einfacher Range-Partitionierung"
        safe_pattern: "Alte Partitionen gezielt truncaten oder reorganisieren statt breite DELETE-Laeufe"
        working_style_note: "MySQL bietet Wartungshebel, aber mit engeren funktionalen Grenzen als Oracle oder SQL Server"
        pitfall: "Storage-Engine- oder FK-Grenzen koennen das scheinbar einfache Design ausbremsen"

  - id: "P3"
    question: "Sind Partitionszahl, Verteilung und Metadatenkosten tragbar?"
    generic_intent: "Overpartitioning und Schieflast vorab erkennen"
    query_pattern: "Zeilen- und Groessenverteilung pro geplanter Partition, Prognose fuer 12 bis 24 Monate und Anzahl aktiver Partitionen erfassen"
    purpose: "Zu viele kleine Partitionen und Schieflast als Betriebsrisiko markieren"
    expected_signal: "Wenige bis maessig viele grosse Partitionen mit nachvollziehbarer Verteilung"
    per_system:
      SQLServer:
        natural_form: "Partitionen, Zeilenzahlen und Speicherbedarf gegen Memory-Overhead und Verwaltungsgrenzen halten"
        protection_pattern: "Partitionszahl konservativ waehlen und Filegroup-Zuordnung nur bei echtem Bedarf differenzieren"
        idiomatic_solution: "Monatlich oder quartalsweise statt hyperfein, wenn die Queries das nicht erzwingen"
        safe_pattern: "Zuerst am Lebenszyklus orientieren, erst dann an theoretischer Granularitaet"
        working_style_note: "Microsoft dokumentiert zusaetzlichen Speicherbedarf und Verwaltungsaufwand bei sehr vielen Partitionen"
        pitfall: "Viele tausend Partitionen erzeugen oft mehr Metadaten- und Memory-Kosten als fachlichen Nutzen"
      PostgreSQL:
        natural_form: "Planner-Kosten und Memory-Fussabdruck bei wachsender Zahl von Child-Tabellen einschaetzen"
        protection_pattern: "Nur so fein partitionieren, wie Betriebs- und Query-Muster es rechtfertigen"
        idiomatic_solution: "Moderate Partitionszahl mit klaren Bounds und konsistenten Benennungen"
        safe_pattern: "Grenzen fuer aktive Partitionen frueh definieren"
        working_style_note: "PostgreSQL nennt explizit laengere Planungszeiten und hoehere Memory-Nutzung als Folge vieler Partitionen"
        pitfall: "Overpartitioning trifft zuerst den Planner, nicht unbedingt die Datenhaltung"
      Oracle:
        natural_form: "Partition Wise Operations, lokale Indizes und Verwaltungskosten gemeinsam betrachten"
        protection_pattern: "Nur dort feiner werden, wo Lifecycle oder Pruning real profitieren"
        idiomatic_solution: "Range plus Unterpartitionierung nur bei klarer fachlicher Begruendung"
        safe_pattern: "Mehrdimensionale Modelle nur einsetzen, wenn sie echte Betriebsfaelle sauber trennen"
        working_style_note: "Oracle kann sehr tief partitionieren, aber diese Reife verzeiht kein unmotiviertes Design"
        pitfall: "Komplexe Composite-Strategien ohne klare Query- und Lifecycle-Muster kippen schnell in Designschuld"
      MySQL:
        natural_form: "Partitionszahl und Verteilung gegen einfache Verwaltungsroutinen und Optimizer-Nutzen abgleichen"
        protection_pattern: "Grenzen schlicht halten und Subpartitionierung nur mit echter Notwendigkeit in Betracht ziehen"
        idiomatic_solution: "Einfache Range- oder Key-Modelle mit kontrollierter Anzahl"
        safe_pattern: "Verteilung erst messen, dann feinere Aufteilung ueberhaupt erwaegen"
        working_style_note: "MySQLs nuetzliche Partitionierungsfaelle sind enger; ueberfeine Modelle zahlen selten zurueck"
        pitfall: "Komplexere Modelle ohne klaren Pruning- oder Wartungsnutzen erzeugen nur Verwaltungsarbeit"

  - id: "P4"
    question: "Passen Index-, Constraint- und Sicherheitsmuster zur Partitionierungsstrategie?"
    generic_intent: "Pruning-Nutzen und Wartungsoperationen gegen Nebenbedingungen absichern"
    query_pattern: "Partition Key, Unique-Regeln, lokale oder globale Indizes und Maintenance-Operationen in einer Matrix pruefen"
    purpose: "Technische Vertraege fuer die spaetere Produktion sichtbar machen"
    expected_signal: "Partition Key, Indizes und Maintenance-Pfade stehen nicht gegeneinander"
    per_system:
      SQLServer:
        natural_form: "Pruefen, ob eindeutige Indizes den Partition Key enthalten und ob alle fuer SWITCH relevanten Indizes aligned sind"
        protection_pattern: "Indexdesign aus der Switch- und Elimination-Perspektive aufbauen"
        idiomatic_solution: "Clustered oder heap-nahe Zielstruktur plus aligned nonclustered indexes bewusst planen"
        safe_pattern: "Vor SWITCH die komplette Strukturgleichheit und Check-Logik pruefen"
        working_style_note: "SQL Server koppelt Partitionierung und Wartung sehr stark an physische Ausrichtung"
        pitfall: "Nicht aligned oder falsch eindeutige Indizes zerstoeren den gehofften Metadatenpfad"
      PostgreSQL:
        natural_form: "Lokale Indexpraxis auf den Partitionen mit Parent-Definition und echter Query-Nutzung zusammen betrachten"
        protection_pattern: "Noetige Constraints und Child-Indizes nicht als spaete Nacharbeit behandeln"
        idiomatic_solution: "Index- und Bounds-Design zusammen entwerfen"
        safe_pattern: "Partitionierte Tabellen erst dann einfuehren, wenn auch die Kindobjekte operational mitgedacht sind"
        working_style_note: "In PostgreSQL ist die Wartbarkeit der Partitionsfamilie wichtiger als ein schoenes Parent-DDL"
        pitfall: "Parent-only-Denken blendet reale Arbeit auf den Partitionsobjekten aus"
      Oracle:
        natural_form: "Lokale und globale Indizes gegen Pruning, Maintenance und Constraint-Anforderungen abwaegen"
        protection_pattern: "Global index fallout bei Partition Maintenance bewusst einplanen"
        idiomatic_solution: "Local indexes fuer wartungsnahe Muster bevorzugen, globale nur mit klarem Query-Grund"
        safe_pattern: "Partition Exchange nur mit vorbereiteter Index- und Constraint-Strategie"
        working_style_note: "Oracle zeigt hier die tiefste Gestaltungsfreiheit und die groesste Verantwortung"
        pitfall: "Global index maintenance wird oft erst nach dem ersten Wartungsfenster schmerzhaft sichtbar"
      MySQL:
        natural_form: "Storage-Engine-Limits, Partitionierungsausdruck und FK-Design gemeinsam pruefen"
        protection_pattern: "Vor dem Entwurf die dokumentierten Partitionierungsgrenzen der Engine lesen"
        idiomatic_solution: "Schlichte Partitionierung mit expliziter Rueckfallstrategie, wenn Engine-Limits dagegen sprechen"
        safe_pattern: "FK-nahe Designs im Zweifel erst gegen die Partitionierungsgrenzen pruefen, dann entscheiden"
        working_style_note: "MySQL verlangt hier weniger Heldentum und mehr fruehe Begrenzung"
        pitfall: "Engine-Limits werden oft zu spaet gelesen und machen die Architektur dann teurer als die Tabelle selbst"

decision_model:
  - step: 1
    question: "Gibt es einen klaren Datenlebenszyklus mit periodischem Laden, Archivieren oder Loeschen?"
    action_if_yes: "Partitionierung bleibt im Rennen und wird als Wartungsstrategie bewertet."
    action_if_no: "Partitionierung nur ueber Query-Muster und besondere Betriebsgruende weiterpruefen."
  - step: 2
    question: "Filtern die wichtigsten Queries regelmaessig und sargierbar auf dem geplanten Partition Key?"
    action_if_yes: "Pruning-Nutzen ist plausibel und kann mit moderater Partitionszahl weiter verfolgt werden."
    action_if_no: "Partitionierung ist hoechstens maintenance-first und darf nicht als Performance-Abkuerzung verkauft werden."
  - step: 3
    question: "Bleibt die Partitionszahl fuer Planung, Metadaten und Operationsfenster tragbar?"
    action_if_yes: "Strategie kann in Richtung robust oder conditionally_safe gehen."
    action_if_no: "Design vereinfachen oder auf Partitionierung verzichten."
  - step: 4
    question: "Sind Index-, Constraint- und Maintenance-Anforderungen je System sauber geklaert?"
    action_if_yes: "Die Strategie kann produktiv geplant werden."
    action_if_no: "Vorher technische Vorarbeit leisten; sonst bleibt der Fall risky."
  - step: 5
    question: "Ist der Hauptnutzen Wartung und Lebenszyklus, nicht nur eine diffuse Performance-Hoffnung?"
    action_if_yes: "Einfaches Zeit- oder Bereichsmodell bevorzugen."
    action_if_no: "Keine Partitionierung oder nur nach sehr strenger Pruning-Pruefung."

