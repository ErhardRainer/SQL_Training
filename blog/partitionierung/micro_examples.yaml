anchor_story:
  title: "Die Partitionen sind da, der Gewinn aber nicht"
  symptom: "Die Tabelle ist monatsweise partitioniert, doch das Reporting scannt weiter fast alles, und der monatliche Purge bleibt ein teures Delete statt eines schnellen Wartungspfads."
  scenario: "Das Team hat nach Volumen partitioniert, nicht nach echten Filter- und Lebenszyklusmustern. Die Fachabfragen filtern auf customer_id statt auf sale_date, und niemand hat vorab geklaert, ob das System ueberhaupt wenige Partitionen ausschliessen kann."
  evidence_level: "inference_based"
  source_refs:
    - "C13"
    - "C14"
  article_usage:
    section: "1. Was das Problem eigentlich ist"
    style: "inline"

syntax_surface:
  SQLServer:
    snippet: "CREATE PARTITION FUNCTION pf_salesdate (date) AS RANGE RIGHT FOR VALUES ('2026-01-01', '2026-02-01');\nCREATE PARTITION SCHEME ps_salesdate AS PARTITION pf_salesdate ALL TO ([PRIMARY]);"
    evidence_level: "docs_based"
    source_refs:
      - "C1"
  PostgreSQL:
    snippet: "CREATE TABLE measurement (logdate date NOT NULL, city_id int NOT NULL) PARTITION BY RANGE (logdate);\nCREATE TABLE measurement_y2026m01 PARTITION OF measurement FOR VALUES FROM ('2026-01-01') TO ('2026-02-01');"
    evidence_level: "docs_based"
    source_refs:
      - "C5"
  Oracle:
    snippet: "CREATE TABLE sales_interval (id number, sale_date date)\nPARTITION BY RANGE (sale_date)\nINTERVAL (NUMTOYMINTERVAL(1, 'MONTH'))\n( PARTITION p_before_2026 VALUES LESS THAN (DATE '2026-01-01') );"
    evidence_level: "docs_based"
    source_refs:
      - "C7"
  MySQL:
    snippet: "CREATE TABLE sales_range (id bigint not null, sale_date date not null)\nPARTITION BY RANGE (TO_DAYS(sale_date)) (\n  PARTITION p202601 VALUES LESS THAN (TO_DAYS('2026-02-01')),\n  PARTITION pmax VALUES LESS THAN MAXVALUE\n);"
    evidence_level: "docs_based"
    source_refs:
      - "C9"

dialect_min_examples:
  SQLServer:
    snippet: "SELECT *\nFROM dbo.sales\nWHERE sale_date >= '2026-01-01'\n  AND sale_date < '2026-02-01';"
    focus: "Sargierbarer Bereichsfilter als Voraussetzung fuer Partition Elimination."
    error_case: "WHERE YEAR(sale_date) = 2026 wirkt lesbar, passt aber nicht zur Partitionierungsidee."
    evidence_level: "docs_based"
    source_refs:
      - "C2"
  PostgreSQL:
    snippet: "SELECT *\nFROM measurement\nWHERE logdate >= DATE '2026-01-01'\n  AND logdate < DATE '2026-02-01';"
    focus: "Declarative Partitioning ueber den Parent mit sauberem Bereichsfilter."
    error_case: "Zu viele Partitionen oder ein Filter ausserhalb des Partition Keys kosten Planung und Speicher."
    evidence_level: "docs_based"
    source_refs:
      - "C5"
      - "C6"
  Oracle:
    snippet: "SELECT *\nFROM sales_interval\nWHERE sale_date >= DATE '2026-01-01'\n  AND sale_date < DATE '2026-02-01';"
    focus: "Range- oder Interval-Partitionierung mit klarer Zeitgrenze."
    error_case: "Global index maintenance kann den scheinbar einfachen Wartungsvorteil relativieren."
    evidence_level: "docs_based"
    source_refs:
      - "C7"
      - "C8"
  MySQL:
    snippet: "SELECT *\nFROM sales_range\nWHERE sale_date >= '2026-01-01'\n  AND sale_date < '2026-02-01';"
    focus: "Partition Pruning braucht einen Ausdruck, der die Partitionsgrenzen wirklich nutzbar macht."
    error_case: "FK-nahe InnoDB-Designs koennen an Partitionierungsgrenzen scheitern."
    evidence_level: "docs_based"
    source_refs:
      - "C10"
      - "C11"

dialect_preflight_blocks:
  - id: "DP1"
    intent: "Pruefen, ob typische Reads entlang des Partition Keys laufen"
    systems:
      SQLServer:
        snippet: "SELECT COUNT(*) AS candidate_rows\nFROM dbo.sales\nWHERE sale_date >= '2026-01-01'\n  AND sale_date < '2026-02-01';"
        natural_form: "Erst den nativen Bereichsfilter pruefen, dann ueber Plan oder Partitionsdiagnose bestaetigen."
        idiomatic_solution: "Datumsbereich mit offener Obergrenze statt Funktionsfilter."
        protection_pattern: "Partition Key nicht in YEAR(), CONVERT() oder andere Ausdrucke einpacken."
        safe_pattern_note: "Die Leselogik muss zur Partition Function passen."
        pitfall: "Ein guter Index allein ersetzt keine passende Partition Elimination."
        evidence_level: "docs_based"
        source_refs:
          - "C2"
      PostgreSQL:
        snippet: "EXPLAIN SELECT *\nFROM measurement\nWHERE logdate >= DATE '2026-01-01'\n  AND logdate < DATE '2026-02-01';"
        natural_form: "Ueber den Parent gehen, aber mit Bounds filtern, die Declarative Partitioning wirklich nutzen kann."
        idiomatic_solution: "Datumsbereich klar auf dem Partition Key formulieren."
        protection_pattern: "Nicht zuerst die Child-Tabellen manuell ansteuern, wenn der Parent die natuerliche Oberflaeche ist."
        safe_pattern_note: "Das System darf wenige Partitionen sehen, nicht die gesamte Familie."
        pitfall: "Zu viele Partitionen schlagen schon vor der eigentlichen Ausfuehrung auf Planung und Speicher durch."
        evidence_level: "docs_based"
        source_refs:
          - "C5"
          - "C6"
      Oracle:
        snippet: "SELECT COUNT(*)\nFROM sales_interval\nWHERE sale_date >= DATE '2026-01-01'\n  AND sale_date < DATE '2026-02-01';"
        natural_form: "Auf saubere Bereichsbedingungen und passende Indexwahl achten."
        idiomatic_solution: "Zeitachsen natuerlich als Range- oder Interval-Muster modellieren."
        protection_pattern: "Lokale und globale Indexwirkung vorab getrennt durchdenken."
        safe_pattern_note: "Pruning und Indexstrategie muessen zueinander passen."
        pitfall: "Die Partitionierung ist nicht automatisch robust, wenn globale Indizes spaeter jede Maintenance verteuern."
        evidence_level: "docs_based"
        source_refs:
          - "C7"
          - "C8"
      MySQL:
        snippet: "EXPLAIN PARTITIONS\nSELECT *\nFROM sales_range\nWHERE sale_date >= '2026-01-01'\n  AND sale_date < '2026-02-01';"
        natural_form: "Mit EXPLAIN PARTITIONS gegen die echten Filter pruefen, nicht nur gegen die DDL-Idee."
        idiomatic_solution: "Einfache Range-Bounds und einfacher Partitionsausdruck."
        protection_pattern: "Komplexe Ausdrucke im Partitionsausdruck vermeiden."
        safe_pattern_note: "Pruning muss sichtbar wenige Partitionen uebrig lassen."
        pitfall: "Partitionierung hilft nicht, wenn der Ausdruck oder die Abfragegrenze die Partitionslogik verdeckt."
        evidence_level: "docs_based"
        source_refs:
          - "C10"

  - id: "DP2"
    intent: "Pruefen, ob der Datenlebenszyklus echte Partition Operations rechtfertigt"
    systems:
      SQLServer:
        snippet: "ALTER PARTITION FUNCTION pf_salesdate()\nSPLIT RANGE ('2026-03-01');"
        natural_form: "Vor dem naechsten Zeitfenster neue Grenze vorbereiten und den Switch-Pfad technisch pruefen."
        idiomatic_solution: "Leere Randpartition plus strukturgleiche Staging-Tabelle."
        protection_pattern: "Check-Constraints und aligned indexes vor jedem SWITCH pruefen."
        safe_pattern_note: "Sliding Window ist eine Wartungsstrategie, keine spontane Notmassnahme."
        pitfall: "Ein unvorbereiteter Grenzsplit im Stressfenster laesst den vermeintlichen Vorteil schnell verschwinden."
        evidence_level: "docs_based"
        source_refs:
          - "C4"
      PostgreSQL:
        snippet: "ALTER TABLE measurement DETACH PARTITION measurement_y2025m12;"
        natural_form: "Detach oder Drop als Wartungspfad gegen grossvolumige Deletes abwaegen."
        idiomatic_solution: "Partitionen frueh anlegen und spaeter gezielt abhaengen."
        protection_pattern: "Bounds und Benennungen so halten, dass die Betriebsroutine nicht ratet."
        safe_pattern_note: "Eine gute Partitionierung vereinfacht Purge und Archivierung sichtbar."
        pitfall: "Wenn jede Retention-Aktion trotzdem ueber alle Partitionen denkt, war das Modell nicht klar genug."
        evidence_level: "docs_based"
        source_refs:
          - "C5"
      Oracle:
        snippet: "ALTER TABLE sales_range EXCHANGE PARTITION p2026_01 WITH TABLE sales_stage;"
        natural_form: "Exchange als Betriebshebel nur mit vorbereiteter Index- und Constraint-Strategie einsetzen."
        idiomatic_solution: "Zeitfenster, Exchange-Pfad und Indexverhalten zusammen planen."
        protection_pattern: "Lokale gegen globale Indexfolgen vorab abwaegen."
        safe_pattern_note: "Oracle belohnt disziplinierte Wartungsmodelle, nicht improvisierte DDL."
        pitfall: "Ohne Indexstrategie wird Exchange schnell vom Feature zur Last."
        evidence_level: "docs_based"
        source_refs:
          - "C7"
          - "C8"
      MySQL:
        snippet: "ALTER TABLE sales_range TRUNCATE PARTITION p202501;"
        natural_form: "Pruefen, ob Truncate, Reorganize oder Exchange Partition den Lebenszyklus wirklich erleichtern."
        idiomatic_solution: "Einfache Range-Partitionierung mit klaren Retention-Schritten."
        protection_pattern: "Storage-Engine- und FK-Grenzen vorab lesen."
        safe_pattern_note: "Nicht jede MySQL-Tabelle wird durch Partitionierung wartbarer."
        pitfall: "Engine-Grenzen erst nach dem Design zu lesen, ist ein klassischer Teamfehler."
        evidence_level: "docs_based"
        source_refs:
          - "C9"
          - "C11"

dialect_safety_patterns:
  SQLServer:
    snippet: "CREATE TABLE dbo.sales_stage ( ... );\nALTER TABLE dbo.sales_stage WITH CHECK ADD CONSTRAINT ck_sales_stage_2026m01 CHECK (sale_date >= '2026-01-01' AND sale_date < '2026-02-01');"
    purpose: "Den Staging- oder Switch-Pfad auf eine einzige Zielpartition absichern."
    idiomatic_role: "Switch-ready vorbereitete Arbeitsmenge."
    pitfall_avoided: "Versehentliches Einswitchen einer Datenmenge ausserhalb der Zielgrenze."
    evidence_level: "docs_based"
    source_refs:
      - "C4"
  PostgreSQL:
    snippet: "CREATE TABLE measurement_y2026m02\n  PARTITION OF measurement\n  FOR VALUES FROM ('2026-02-01') TO ('2026-03-01');"
    purpose: "Naechste Zeitpartition vorab anlegen, statt den Betrieb bei Eintreffen neuer Daten zu improvisieren."
    idiomatic_role: "Betriebsvorbereitung fuer deklarative Partitionierung."
    pitfall_avoided: "Spontane Lastspitzen und hektische DDL waehrend des Produktivlaufs."
    evidence_level: "docs_based"
    source_refs:
      - "C5"
  Oracle:
    snippet: "CREATE INDEX sales_local_ix ON sales_interval (sale_date) LOCAL;"
    purpose: "Wartungsnahe Indexstrategie sichtbar machen."
    idiomatic_role: "Lokaler Index als natuerliches Wartungsmuster fuer Partition Operations."
    pitfall_avoided: "Spaet erkannte globale Indexkosten bei Maintenance."
    evidence_level: "docs_based"
    source_refs:
      - "C8"
  MySQL:
    snippet: "/* Vor der Einfuehrung: FK- und Storage-Engine-Grenzen gegen das Design pruefen */\nEXPLAIN PARTITIONS SELECT * FROM sales_range WHERE sale_date >= '2026-01-01' AND sale_date < '2026-02-01';"
    purpose: "Vor dem Entwurf pruefen, ob Engine-Grenzen und Pruning-Nutzen ueberhaupt zur Tabelle passen."
    idiomatic_role: "Fruehe Architekturpruefung statt spaeter Notkorrektur."
    pitfall_avoided: "Partitionierung auf einer Tabelle, die wegen Engine-Grenzen oder query-blindem Design nie sauber profitiert."
    evidence_level: "docs_based"
    source_refs:
      - "C10"
      - "C11"

