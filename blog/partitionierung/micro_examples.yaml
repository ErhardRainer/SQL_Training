warning_boxes:
  - id: "WB1"
    title: "Die haeufigste Produktionsfalle"
    message: "Partitioniere keine grosse Tabelle nur deshalb, weil sie gross ist. Wenn Query-Muster und Lebenszyklus nicht auf dem Partition Key liegen, bleiben Pruning-Gewinn und Wartungsgewinn schwach, waehrend Metadaten-, Planungs- und Betriebsaufwand steigen."
    severity: "high"
    evidence_level: "inference_based"
    source_refs:
      - "C13"
      - "C14"

anti_pattern_blocks:
  - id: "AP1"
    anti_pattern: "Jede Monatsgrenze als eigene Partition, obwohl die kritischen Queries fast nur ueber customer_id, status oder freie Suche laufen."
    robust_form: "Nur dann nach Monat partitionieren, wenn Monatsfilter, Retention oder Ladefenster wirklich entlang derselben Zeitachse arbeiten; sonst zuerst Index- und Query-Design korrigieren."
    rationale: "Partitionierung ersetzt weder Datenmodellierung noch sargierbare Zugriffspfade."
    evidence_level: "inference_based"
    source_refs:
      - "C13"
      - "C14"

signature_visual:
  format: "ascii"
  title: "Leselogik vs. Wartungslogik"
  purpose: "Den Kernnutzen von Partitionierung in zwei getrennten, aber idealerweise deckungsgleichen Pfaden sichtbar machen."
  body: "Leselogik:   WHERE sale_date im Fenster  -> wenige Partitionen lesen -> weniger unnoetiges I/O\nWartungslogik: neue Periode vorbereiten -> Daten einspielen -> alte Periode detach, switch oder drop\nKernfrage: Nutzen beide Pfade denselben Partition Key, oder lebt nur die DDL davon?"
  evidence_level: "inference_based"
  source_refs:
    - "C13"
  article_usage:
    section: "7. Die wichtigste praktische Unterscheidung"
    style: "diagram"

decision_visual:
  format: "mermaid"
  title: "Soll die Tabelle wirklich partitioniert werden?"
  body: "flowchart TD\n    A[Klarer Datenlebenszyklus?] -->|Nein| B[Nur ueber Query-Muster weiterpruefen]\n    A -->|Ja| C[Wichtige Queries filtern auf dem Partition Key?]\n    C -->|Ja| D[Pruning und Wartung koennen zusammenwirken]\n    C -->|Nein| E[Maintenance-first oder keine Partitionierung]\n    D --> F[Partitionszahl und Indexfolgen tragbar?]\n    E --> F\n    F -->|Nein| G[Design vereinfachen oder verwerfen]\n    F -->|Ja| H[robust oder conditionally_safe]"
  evidence_level: "inference_based"
  source_refs:
    - "C13"
    - "C14"

