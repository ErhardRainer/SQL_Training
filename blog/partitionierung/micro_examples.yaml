    strategy: "sliding_window_sqlserver"
    target_risk_class: "robust"
    snippet: "ALTER PARTITION FUNCTION pf_salesdate() SPLIT RANGE ('2026-03-01');\n-- Daten nur fuer Februar 2026 in dbo.sales_stage bereitstellen\nALTER TABLE dbo.sales_stage SWITCH TO dbo.sales PARTITION 2;\n-- Alte Periode danach ausswitchen oder archivieren"
