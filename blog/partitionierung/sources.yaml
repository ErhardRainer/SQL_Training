    confidence: "high"
    article_section: "8. Welche Rolle Indizes, Constraints, Logging und Locks spielen"

  - claim_id: "C12"
    claim: "Die aktuelle sichtbare Versionsbasis fuer den Artikel ist SQL Server 2022, PostgreSQL 18, Oracle AI Database 26ai und MySQL 8.4."
