claims_register:
  - claim_id: "C1"
    claim: "SQL Server partitioniert Tabellen und Indizes ueber Partition Functions und Partition Schemes; die Aufteilung ist eine physische Verwaltungsstruktur, nicht nur eine kosmetische Syntax."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N2"
    supported_by:
      - system: "SQLServer"
        source_title: "Partitioned tables and indexes"
        url: "https://learn.microsoft.com/en-us/sql/relational-databases/partitions/partitioned-tables-and-indexes?view=sql-server-ver17"
      - system: "SQLServer"
        source_title: "CREATE PARTITION FUNCTION (Transact-SQL)"
        url: "https://learn.microsoft.com/en-us/sql/t-sql/statements/create-partition-function-transact-sql?view=sql-server-ver17"
      - system: "SQLServer"
        source_title: "CREATE PARTITION SCHEME (Transact-SQL)"
        url: "https://learn.microsoft.com/en-us/sql/t-sql/statements/create-partition-scheme-transact-sql?view=sql-server-ver17"
    confidence: "high"
    article_section: "6. Deep Dive: SQL Server als fuehrendes System"

  - claim_id: "C2"
    claim: "SQL Server profitiert fuer Query Processing nur dann von Partitionierung, wenn der Optimizer relevante Partitionen ueber geeignete Praedikate ausschliessen kann."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N1"
      - "N3"
    supported_by:
      - system: "SQLServer"
        source_title: "Partitioned tables and indexes"
        url: "https://learn.microsoft.com/en-us/sql/relational-databases/partitions/partitioned-tables-and-indexes?view=sql-server-ver17"
    confidence: "high"
    article_section: "5. Was intern eigentlich passiert"

  - claim_id: "C3"
    claim: "Auf partitionierten SQL-Server-Tabellen muessen eindeutige Indizes den Partition Key enthalten; viele Partitionen erzeugen zusaetzlichen Verwaltungs- und Speicheraufwand."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N5"
      - "N6"
    supported_by:
      - system: "SQLServer"
        source_title: "Partitioned tables and indexes"
        url: "https://learn.microsoft.com/en-us/sql/relational-databases/partitions/partitioned-tables-and-indexes?view=sql-server-ver17"
    confidence: "high"
    article_section: "8. Welche Rolle Indizes, Constraints, Logging und Locks spielen"

  - claim_id: "C4"
    claim: "SQL Servers Sliding-Window-Muster lebt von vorbereiteten Randpartitionen und strukturgleichen Switch-Pfaden; der Nutzen ist vor allem administrativ."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N4"
      - "N10"
    supported_by:
      - system: "SQLServer"
        source_title: "Manage retention of historical data in system-versioned temporal tables"
        url: "https://learn.microsoft.com/en-us/sql/relational-databases/tables/manage-retention-of-historical-data-in-system-versioned-temporal-tables?view=sql-server-ver17"
    confidence: "high"
    article_section: "10. Die Hauptstrategien sauber eingeordnet"

  - claim_id: "C5"
    claim: "PostgreSQLs partitionierte Tabelle ist eine virtuelle Oberflaeche; die eigentlichen Daten liegen in den Partitionen, und partition pruning sowie detach/drop koennen Query- und Wartungsvorteile bringen."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N2"
      - "N4"
    supported_by:
      - system: "PostgreSQL"
        source_title: "PostgreSQL 18: Table Partitioning"
        url: "https://www.postgresql.org/docs/18/ddl-partitioning.html"
    confidence: "high"
    article_section: "5. Was intern eigentlich passiert"

  - claim_id: "C6"
    claim: "PostgreSQL warnt ausdruecklich davor, dass zu viele Partitionen laengere Planungszeiten und hoeheren Speicherverbrauch verursachen koennen."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N5"
      - "N9"
    supported_by:
      - system: "PostgreSQL"
        source_title: "PostgreSQL 18: Table Partitioning"
        url: "https://www.postgresql.org/docs/18/ddl-partitioning.html"
    confidence: "high"
    article_section: "4. Wovon Verhalten, Risiko und Kosten abhaengen"

  - claim_id: "C7"
    claim: "Oracle positioniert Partitioning als Technik fuer Verwaltbarkeit, Performance und Verfuegbarkeit und bietet Range-, List-, Hash-, Interval- und Reference-Partitioning."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N2"
      - "N7"
    supported_by:
      - system: "Oracle"
        source_title: "Oracle AI Database 26ai VLDB and Partitioning Guide: Partitioning Concepts"
        url: "https://docs.oracle.com/en/database/oracle/oracle-database/26/vldbg/partition-concepts.html"
    confidence: "high"
    article_section: "Systemvergleich auf einen Blick"

  - claim_id: "C8"
    claim: "Oracle trennt lokale und globale Indizes deutlich; diese Wahl wirkt direkt auf Pruning, Maintenance und die Kosten von Partition Operations."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N6"
    supported_by:
      - system: "Oracle"
        source_title: "Oracle AI Database 26ai VLDB and Partitioning Guide: Partitioning Concepts"
        url: "https://docs.oracle.com/en/database/oracle/oracle-database/26/vldbg/partition-concepts.html"
      - system: "Oracle"
        source_title: "Oracle Database 19c VLDB and Partitioning Guide"
        url: "https://docs.oracle.com/en/database/oracle/oracle-database/19/vldbg/toc.htm"
    confidence: "high"
    article_section: "8. Welche Rolle Indizes, Constraints, Logging und Locks spielen"

  - claim_id: "C9"
    claim: "MySQL 8.4 bietet RANGE-, LIST-, HASH- und KEY-Partitionierung sowie Verwaltungsoperationen wie Reorganize, Truncate und Exchange Partition."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N4"
      - "N8"
    supported_by:
      - system: "MySQL"
        source_title: "MySQL 8.4 Reference Manual: Overview of Partitioning in MySQL"
        url: "https://dev.mysql.com/doc/refman/8.4/en/partitioning-overview.html"
      - system: "MySQL"
        source_title: "MySQL 8.4 Reference Manual: Partition Management"
        url: "https://dev.mysql.com/doc/refman/8.4/en/partitioning-management.html"
    confidence: "high"
    article_section: "Systemvergleich auf einen Blick"

  - claim_id: "C10"
    claim: "MySQL Partition Pruning begrenzt Scans nur dann auf relevante Partitionen, wenn der WHERE-Ausdruck die Partitionsgrenzen wirklich nutzbar macht."
    evidence_level: "docs_based"
    origin_note_ids:
      - "N1"
      - "N3"
    supported_by:
      - system: "MySQL"
        source_title: "MySQL 8.4 Reference Manual: Partition Pruning"
        url: "https://dev.mysql.com/doc/refman/8.4/en/partitioning-pruning.html"
    confidence: "high"
    article_section: "5. Was intern eigentlich passiert"

  - claim_id: "C11"
    claim: "Partitionierte InnoDB-Tabellen in MySQL 8.4 unterliegen dokumentierten Foreign-Key-Grenzen; das ist ein wichtiger Architekturkontrast zu den anderen drei Systemen."
    evidence_level: "docs_based"
