  - claim_id: "C13"
    claim: "Partitionierung hat ueber alle vier Systeme hinweg ihren staerksten dokumentierten Nutzen dort, wo Datenlebenszyklus und Partition Key zusammenfallen; reine Performance-Hoffnung ohne passende Praedikate ist fachlich zu schwach."
